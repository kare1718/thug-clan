        const wEnt = s.w === 'a' ? s.a : s.b;
        if (s.w === 'a') { ev.elimB.add(s.b); ev.sa++; } else { ev.elimA.add(s.a); ev.sb++; }
        stay = { side: s.w, ent: wEnt, streak: stay && stay.ent === wEnt ? stay.streak + 1 : 1 };
        ev.wins.set(wEnt, (ev.wins.get(wEnt) || 0) + 1);
        ev.notes.push({ streak: stay.streak });
        ev.valid = k + 1;
        if (ev.elimB.size >= MB.length) ev.winner = ta; else if (ev.elimA.size >= MA.length) ev.winner = tb;
      }
      ev.stay = ev.winner == null ? stay : null;
      if (ev.winner != null) {
        const loseN = ev.winner === ta ? MB.length : MA.length;
        if (loseN >= 2) for (const [e, w] of ev.wins) if (w >= loseN) ev.allkill = e;
      }
    } else {
      const N = lg.sets, nd = need(N);
      for (let k = 0; k < sets.length; k++) {
        const s = sets[k];
        if (ev.winner != null || k >= N || !ok(s)) break;
        const ace = lg.ace && k === N - 1;
        if (!ace && (ev.usedA.has(s.a) || ev.usedB.has(s.b))) break;
        if (!ace) { ev.usedA.add(s.a); ev.usedB.add(s.b); }
        if (s.w === 'a') ev.sa++; else ev.sb++;
        const wEnt = s.w === 'a' ? s.a : s.b;
        ev.wins.set(wEnt, (ev.wins.get(wEnt) || 0) + 1);
        ev.notes.push({ ace });
        ev.valid = k + 1;
        if (ev.sa >= nd) ev.winner = ta; else if (ev.sb >= nd) ev.winner = tb;
      }
    }
    ev.st = ev.winner != null ? 'done' : ev.valid ? 'live' : 'ready';
    return ev;
  }
  function teamMatch(lg, id, a, b) {
    const raw = lg.tres[id];
    const all = raw && raw.pa === a && raw.pb === b && Array.isArray(raw.sets) ? raw.sets : [];
    const ev = evalSets(lg, a, b, all);
    return { sets: all.slice(0, ev.valid), ev };
  }
  // 다음 세트에 낼 수 있는 선수. fixed: 승자 연전에서 남아 있는 선수
  function eligible(lg, ta, tb, prefix, side) {
    const M = lg.teams[side === 'a' ? ta : tb].members;
    const ev = evalSets(lg, ta, tb, prefix);
    const why = new Map();
    if (ev.winner != null) return { list: [], fixed: null, why };
    if (lg.mode === 'relay') {
      if (ev.stay && ev.stay.side === side) { for (const e of M) if (e !== ev.stay.ent) why.set(e, (side === 'a' ? ev.elimA : ev.elimB).has(e) ? '짐' : '대기'); return { list: [ev.stay.ent], fixed: ev.stay.ent, why, streak: ev.stay.streak }; }
      const el = side === 'a' ? ev.elimA : ev.elimB;
      for (const e of el) why.set(e, '짐');
      return { list: M.filter((e) => !el.has(e)), fixed: null, why };
    }
    const k = prefix.length;
    if (k >= lg.sets) return { list: [], fixed: null, why };
    if (lg.ace && k === lg.sets - 1) return { list: M.slice(), fixed: null, why, ace: true };
    const u = side === 'a' ? ev.usedA : ev.usedB;
    for (const e of u) why.set(e, '나옴');
    return { list: M.filter((e) => !u.has(e)), fixed: null, why };
  }
  function teamRrMatches(lg) {
    const out = [];
    const pairs = rrPairs(lg.teams.map((_, i) => i));
    for (let leg = 0; leg < lg.legs; leg++) {
      for (const [x, y] of pairs) {
        const a = leg ? y : x, b = leg ? x : y;
        const id = `t-${x}-${y}-${leg}`;
        out.push({ id, a, b, leg, no: out.length + 1, round: '', ...resultOf(lg, id, a, b) });
      }
    }
    return out;
  }
  // 두 팀이 정해진 팀 경기(부전승 빼고)
  function teamGames(lg) {
    if (lg.tfmt === 'tour') return allMatches(bracket(lg)).filter((m) => m.st !== 'bye' && m.a != null && m.b != null && m.a >= 0 && m.b >= 0);
    return teamRrMatches(lg);
  }
  function teamStandings(lg) {
    const ms = teamRrMatches(lg);
    const t = lg.teams.map((_, i) => ({ i, n: 0, w: 0, l: 0, sw: 0, sl: 0 }));
    for (const mt of ms) {
      if (mt.winner == null) continue;
      const A = t[mt.a], B = t[mt.b];
      A.n++; B.n++; A.sw += mt.res.a; A.sl += mt.res.b; B.sw += mt.res.b; B.sl += mt.res.a;
      if (mt.winner === mt.a) { A.w++; B.l++; } else { B.w++; A.l++; }
    }
    return { rows: rankRows(t, ms, (i) => tname(lg, i)), ms };
  }
  // 이 리그 안의 개인 기록: 세트 승패, 최다 연승(넣은 시각 순), 올킬
  function playerStats(lg) {
    const st = new Map(lg.ents.map((_, i) => [i, { i, t: teamIx(lg, i), w: 0, l: 0, best: 0, cur: 0, ak: 0 }]));
    const evs = [];
    teamGames(lg).forEach((mt, mi) => {
      if (!mt.tm) return;
      mt.tm.sets.forEach((s, k) => evs.push({ s, at: s.at || 0, mi, k }));
      const ak = mt.tm.ev.allkill;
      if (ak != null && st.has(ak)) st.get(ak).ak++;
    });
    evs.sort((x, y) => x.at - y.at || x.mi - y.mi || x.k - y.k);
    for (const { s } of evs) {
      const W = st.get(s.w === 'a' ? s.a : s.b), L = st.get(s.w === 'a' ? s.b : s.a);
      if (!W || !L) continue;
      W.w++; W.cur++; W.best = Math.max(W.best, W.cur);
      L.l++; L.cur = 0;
    }
    const rows = [...st.values()].map((r) => ({ ...r, n: r.w + r.l, rate: r.w + r.l ? r.w / (r.w + r.l) : 0 }));
    const played = rows.filter((r) => r.n).sort((x, y) => y.w - x.w || y.rate - x.rate || x.l - y.l || entName(lg, x.i).localeCompare(entName(lg, y.i), 'en'));
    played.forEach((r, k) => { r.rank = k && played[k - 1].w === r.w && played[k - 1].l === r.l ? played[k - 1].rank : k + 1; });
    const idle = rows.filter((r) => !r.n).sort((x, y) => x.t - y.t || entName(lg, x.i).localeCompare(entName(lg, y.i), 'en'));
    return [...played, ...idle];
  }

  function progress(lg) {
    let all;
    if (isBracket(lg)) all = allMatches(bracket(lg)).filter((m) => m.st !== 'bye');
    else if (isTeam(lg)) all = teamRrMatches(lg);
    else all = lg.groups.flatMap((_, gi) => rrMatches(lg, gi));
    return { done: all.filter((m) => m.st === 'done').length, total: all.length };
  }
  function winnersText(lg) {
    if (isBracket(lg)) { const c = champion(lg); return c != null ? sideName(lg, c) : null; }
    if (isTeam(lg)) { const { rows, ms } = teamStandings(lg); return ms.length && ms.every((m) => m.winner != null) ? tname(lg, rows[0].i) : null; }
    if (!rrDone(lg)) return null;
    return lg.groups.map((_, gi) => entName(lg, standings(lg, gi).rows[0].i)).join(', ');
  }

  // ---------------- 메달(저장하지 않고 리그 결과에서 매번 셈. 결과를 고치면 따라 바뀜) ----------------
  // 개인·팀 토너먼트: 결승이 끝나면 우승 금·준우승 은, 3·4위전을 치러 끝났으면 3위 동(팀은 팀원 전원)
  // 팀 풀리그: 모든 경기가 끝나면 1위 팀원 금·2위 팀원 은. 개인 풀리그: 모든 경기가 끝나면 조마다 1~3위 금·은·동
  // 공동 순위(이긴 경기·세트 득실·승자승·딴 세트가 모두 같음)는 같은 메달을 함께 받고 다음 순위는 그만큼 밀림
  const MEDALS = ['gold', 'silver', 'bronze'];
  const medalLabel = (k) => (typeof MD !== 'undefined' && MD && MD.LABEL && MD.LABEL[k]) || { gold: '금메달', silver: '은메달', bronze: '동메달' }[k];
  function medalIcon(k, px) {
    if (typeof MD === 'undefined' || !MD || !MD.icon) return null;
    try { const c = MD.icon(k, px); if (c) { c.classList.add('lg-md'); c.setAttribute('aria-hidden', 'true'); c.removeAttribute('aria-label'); } return c; } catch (e) { return null; }
  }
  function sharedPlaces(rows) {
    const pl = [];
    rows.forEach((r, k) => { const q = rows[k - 1]; pl.push(k && q.w === r.w && q.d === r.d && (q.hh || 0) === (r.hh || 0) && q.sw === r.sw ? pl[k - 1] : k + 1); });
    return pl;
  }
  // 마지막으로 결과가 들어간 시각(개인 경기의 at, 팀 경기 세트의 at). 하나도 없으면 리그 만든 시각
  function lastAt(lg, ms) {
    let t = 0;
    for (const m of ms) {
      if (!m.res) continue;
      if (m.tm) { for (const x of m.tm.sets) t = Math.max(t, x.at || 0); } else if (m.res.at) t = Math.max(t, m.res.at);
    }
    return t || lg.created;
  }
  // 한 리그의 메달: { date, list: [{ kind, place, ix(참가자 번호), team(팀 이름|null), ti(팀 번호) }] } | null
  function awards(lg) {
    if (!lg || lg.example || lg.hidden || lg._bad) return null;
    const list = [];
    const add = (kind, place, side) => {
      if (side == null || side < 0) return;
      if (isTeam(lg)) { const T = lg.teams[side]; if (T) for (const e of T.members) list.push({ kind, place, ix: e, team: T.name, ti: side }); }
      else list.push({ kind, place, ix: side, team: null, ti: -1 });
    };
    let ms;
    if (isBracket(lg)) {
      const rs = bracket(lg);
      ms = allMatches(rs);
      const f = finalOf(rs);
      if (f.st !== 'done' || f.winner == null || f.winner < 0) return null;
      add('gold', 1, f.winner);
      add('silver', 2, f.winner === f.a ? f.b : f.a);
      if (lg.third && rs.p3 && rs.p3.st === 'done') add('bronze', 3, rs.p3.winner);
    } else if (isTeam(lg)) {
      const st = teamStandings(lg);
      ms = st.ms;
      if (!ms.length || ms.some((m) => m.winner == null)) return null;
      const pl = sharedPlaces(st.rows);
      st.rows.forEach((r, k) => { if (pl[k] <= 2) add(MEDALS[pl[k] - 1], pl[k], r.i); });
    } else {
      const per = lg.groups.map((_, gi) => standings(lg, gi));
      ms = per.flatMap((x) => x.ms);
      if (!ms.length || ms.some((m) => m.winner == null)) return null;
      for (const { rows } of per) { const pl = sharedPlaces(rows); rows.forEach((r, k) => { if (pl[k] <= 3) add(MEDALS[pl[k] - 1], pl[k], r.i); }); }
    }
    return list.length ? { date: lastAt(lg, ms), list } : null;
  }
  const medalEntry = (lg, aw, x) => ({ kind: x.kind, leagueId: lg.id, leagueName: lg.name, date: aw.date, place: x.place, team: x.team });
  // 클랜원마다 받은 메달(날짜 최신 순): { personId: [{ kind, leagueId, leagueName, date(ms), place, team }] }. 클랜원이 아닌 이름은 빠짐
  function medals() {
    const out = {};
    for (const lg of leagues()) {
      const aw = awards(lg);
      if (!aw) continue;
      for (const x of aw.list) {
        const e = lg.ents[x.ix];
        if (!e || !e.id || !DB.byId.has(e.id)) continue;
        (out[e.id] || (out[e.id] = [])).push(medalEntry(lg, aw, x));
      }
    }
    for (const k of Object.keys(out)) out[k].sort((x, y) => y.date - x.date || x.place - y.place || x.leagueName.localeCompare(y.leagueName, 'ko'));
    return out;
  }
  // 그 리그에서 받은 메달 하나 또는 null(꾸미기에서 단 메달이 아직 유효한지 볼 때)
  function medalOf(personId, leagueId) {
    if (!personId || !leagueId) return null;
    const lg = byLeague(String(leagueId));
    const aw = awards(lg);
    if (!aw) return null;
    const x = aw.list.find((y) => lg.ents[y.ix] && lg.ents[y.ix].id === personId);
    return x ? medalEntry(lg, aw, x) : null;
  }
  // 메달 받은 쪽 이름: 개인은 이름, 팀은 '팀 이름(팀원, 팀원)'
  function medalNames(lg, aw, kind, withMembers) {
    const xs = aw.list.filter((x) => x.kind === kind);
    if (!isTeam(lg)) return xs.map((x) => lg.ents[x.ix].name);
    const ts = [...new Set(xs.map((x) => x.ti))];
    return ts.map((t) => tname(lg, t) + (withMembers ? `(${xs.filter((x) => x.ti === t).map((x) => lg.ents[x.ix].name).join(', ')})` : ''));
  }
  const medalText = (lg, aw) => MEDALS.filter((k) => aw.list.some((x) => x.kind === k)).map((k) => `${medalLabel(k)} ${medalNames(lg, aw, k, true).join(', ')}`).join(', ');

  // ---------------- 팀 나누기 ----------------
  // 래더 현재 점수. 기록이 없는 사람은 참가자 평균(참가자 모두 없으면 클랜 래더 평균)으로 봄
  function scoreMap(sel) {
    const vals = sel.map(mmrOf).filter((v) => v >= 0);
    const base = vals.length ? vals : DB.ladder.map((p) => p.mmr.cur.v);
    const avg = base.length ? Math.round(base.reduce((s, v) => s + v, 0) / base.length) : 0;
    return { avg, of: (i) => { const v = mmrOf(sel[i]); return v >= 0 ? v : avg; }, est: (i) => mmrOf(sel[i]) < 0 };
  }
  // 점수 순 지그재그(1→k, k→1)로 넣고, 팀 점수 차이가 줄어드는 맞바꿈을 찾아 고침. shuffle이면 비슷한 점수끼리 섞어 다른 조합을 냄
  function autoSplit(sel, k, shuffle) {
    const sc = scoreMap(sel);
    const order = sel.map((_, i) => i).sort((x, y) => sc.of(y) - sc.of(x) || x - y);
    if (shuffle) {
      for (let s = 0; s < order.length; s += k) {
        const band = order.slice(s, s + k);
        for (let i = band.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [band[i], band[j]] = [band[j], band[i]]; }
        order.splice(s, band.length, ...band);
      }
    }
    const teams = Array.from({ length: k }, () => []);
    order.forEach((ix, j) => { const row = Math.floor(j / k), col = j % k; teams[row % 2 ? k - 1 - col : col].push(ix); });
    const eq = teams.every((t) => t.length === teams[0].length);
    const val = (t) => { const s = t.reduce((a, i) => a + sc.of(i), 0); return eq ? s : t.length ? s / t.length : 0; };
    const spread = () => { const v = teams.map(val); return Math.max(...v) - Math.min(...v); };
    for (let it = 0; it < 80; it++) {
      const cur = spread();
      let best = null;
      for (let p = 0; p < k; p++) for (let q = p + 1; q < k; q++) {
        for (let x = 0; x < teams[p].length; x++) for (let y = 0; y < teams[q].length; y++) {
          [teams[p][x], teams[q][y]] = [teams[q][y], teams[p][x]];
          const s = spread();
          [teams[p][x], teams[q][y]] = [teams[q][y], teams[p][x]];
          if (s < cur - 0.001 && (!best || s < best.s)) best = { p, q, x, y, s };
        }
      }
      if (!best) break;
      const { p, q, x, y } = best;
      [teams[p][x], teams[q][y]] = [teams[q][y], teams[p][x]];
    }
    for (const t of teams) t.sort((x, y) => sc.of(y) - sc.of(x) || x - y);
    return teams;
  }

  // ---------------- 리그 만들기 ----------------
  function build(o) {
    const lg = {
      v: 2, id: newId(), name: o.name, kind: o.kind, bo: o.bo || 3, created: Date.now(), example: !!o.example, hidden: false,
      note: o.note || '', ents: o.ents.map((e) => ({ id: e.id || null, name: e.name })), res: {}, rmemo: {},
    };
    const brOpts = () => { lg.fmtB = o.fmtB; lg.auto = o.auto || null; lg.rd = {}; lg.dlog = o.dlog || {}; normBr(lg); };
    if (lg.kind === 'tour') { lg.third = !!o.third; placeSeeds(lg, o.order); brOpts(); }
    else if (lg.kind === 'team') {
      lg.tfmt = o.tfmt === 'tour' ? 'tour' : 'rr';
      lg.mode = o.mode === 'relay' ? 'relay' : 'entry';
      lg.sets = SETS.includes(o.sets) ? o.sets : 5;
      lg.ace = !!o.ace;
      lg.legs = o.legs === 2 ? 2 : 1;
      lg.third = lg.tfmt === 'tour' && !!o.third;
      lg.teams = o.teams.map((t, i) => ({ name: t.name || letter(i) + '팀', color: t.color, members: t.members.slice(), cap: t.cap != null ? t.cap : null }));
      lg.tres = {};
      if (lg.tfmt === 'tour') { placeSeeds(lg, o.torder || lg.teams.map((_, i) => i)); brOpts(); }
    } else {
      const g = Math.max(1, Math.min(4, o.groups || 1));
      lg.legs = o.legs === 2 ? 2 : 1;
      lg.groups = Array.from({ length: g }, () => []);
      o.order.forEach((ix, k) => { const row = Math.floor(k / g), col = k % g; lg.groups[row % 2 ? g - 1 - col : col].push(ix); });
    }
    return lg;
  }
  // 표본 경기에서 세트 점수: 리그 흔적이 있는 경기 먼저, 그다음 오래된 순으로 need승까지
  function scoreFromGames(games, aId, bId, bo) {
    const n = need(bo);
    const list = games.slice().sort((x, y) => (isTrace(y) - isTrace(x)) || x.time - y.time);
    let a = 0, b = 0;
    const gt = [];
    for (const g of list) {
      if (a >= n || b >= n) break;
      const wid = g.p[g.winner] && g.p[g.winner].id;
      if (wid === aId) a++; else if (wid === bId) b++; else continue;
      gt.push(g.t);
    }
    return { a, b, gt };
  }
  function makeExample() {
    const top = DB.ladder.slice(0, 16);
    if (top.length < 4) return null;
    const lg = build({
      name: `예시 · 래더 상위 ${top.length}명 토너먼트`, kind: 'tour', bo: 3, example: true,
      ents: top.map((p) => ({ id: p.id, name: p.name })), order: top.map((_, i) => i),
      note: '예시 리그입니다. 실제로 열린 리그가 아니고, 표본에 두 사람이 실제로 붙은 기록이 있는 경기만 그 기록으로 채웠습니다.',
    });
    for (let pass = 0; pass < 6; pass++) {
      let added = 0;
      for (const mt of bracket(lg).flat()) {
        if (mt.st !== 'ready' || lg.res[mt.id]) continue;
        const A = lg.ents[mt.a], B = lg.ents[mt.b];
        const games = DB.vs(A.id, B.id).games;
        if (!games.length) continue;
        const s = scoreFromGames(games, A.id, B.id, lg.bo);
        lg.res[mt.id] = { pa: mt.a, pb: mt.b, a: s.a, b: s.b, gt: s.gt, src: 'rec' };
        added++;
      }
      if (!added) break;
    }
    return lg;
  }
  // 예시 팀리그: 래더 상위 12명을 자동으로 3팀으로. 결과는 비워 둠
  function makeTeamExample() {
    const top = DB.ladder.slice(0, 12);
    if (top.length < 6) return null;
    const ents = top.map((p) => ({ id: p.id, name: p.name }));
    const split = autoSplit(ents, 3, false);
    return build({
      name: `예시 · 래더 상위 ${top.length}명 3팀 팀리그`, kind: 'team', example: true, ents,
      tfmt: 'rr', mode: 'entry', sets: 5, ace: true, legs: 1,
      teams: split.map((m, i) => ({ name: letter(i) + '팀', color: i, members: m, cap: null })),
      note: '예시 팀리그입니다. 실제로 열린 리그가 아니고 결과는 비어 있습니다.',
    });
  }

  // 리그 흔적이 있는 표본 경기를 두 사람·날짜로 묶음
  let traceCache = null;
  function traces() {
    if (traceCache) return traceCache;
    const map = new Map();
    for (const g of DB.games) {
      if (!isTrace(g) || g.p.length !== 2 || g.winner < 0) continue;
      const ks = g.p.map((x) => (x.id ? 'p:' + x.id : 'n:' + x.n.toLowerCase())).sort();
      const key = ks.join('|') + '|' + fmt.dayKey(g.time);
      let e = map.get(key);
      if (!e) {
        const [x, y] = ks.map((k) => g.p.find((q) => (q.id ? 'p:' + q.id : 'n:' + q.n.toLowerCase()) === k));

  const selKey = (e) => (e.id ? 'p:' + e.id : 'n:' + e.name.toLowerCase());

  // 클랜원 고르기(새 리그 2단계와 자동 짜기 '직접 고르기' 공용). after: 고른 사람이 바뀐 뒤 부름
  function picker(d, after) {
    const q = h('input', { id: 'lg-d-q', type: 'search', class: 'field sm', 'data-k': 'd-q', value: d.q, placeholder: '이름 찾기', autocomplete: 'off' });

      const k = 'p:' + p.id;

      changed();

    const visible = () => {
      const term = d.q.trim().toLowerCase();

    };
    function draw() {
      chipsBox.replaceChildren(...RACES.map(([k, t]) => chip(d.race === k, k === 'all' ? t : raceBadge(k), () => { d.race = k; draw(); }, { 'aria-label': t, 'data-k': 'race-' + k })));
      const rows = visible();
      list.replaceChildren(...rows.map((p) => {
        const on = has('p:' + p.id);
        return h('li', null, h('button', { type: 'button', class: 'lg-pk' + (on ? ' on' : ''), 'aria-pressed': String(on), 'data-k': 'pk-' + p.id, onclick: () => toggle(p) },

          icon({ id: p.id }, 24), raceBadge(p.main),
          h('span', { class: 'nm' }, p.name),

      }));
      if (!rows.length) list.append(h('li', { class: 'empty' }, '맞는 클랜원이 없습니다.'));
      const n = d.sel.length;
      const tail = d.kind === 'tour' && n >= 2 ? ` · ${pow2(n)}강, 부전승 ${pow2(n) - n}자리`
        : d.kind === 'team' && n ? ` · ${d.teamN}팀, 팀마다 ${Math.floor(n / d.teamN)}${n % d.teamN ? `~${Math.ceil(n / d.teamN)}` : ''}명`
          : d.kind === 'rr' && n ? ` · ${d.groups}개 조` : '';
      count.replaceChildren(h('span', null, h('b', { class: 'gold' }, `${n}명`), ' 골랐습니다', tail ? h('span', { class: 'c-dim' }, tail) : null));
      selBox.replaceChildren(...d.sel.map((e) => h('li', { class: 'lg-sel-i' }, icon(e, 16), h('span', { class: 'nm' + (e.id ? '' : ' outsider') }, e.name),
        h('button', { type: 'button', class: 'lg-x', 'aria-label': `${e.name} 빼기`, 'data-k': 'rm-' + selKey(e), onclick: () => { d.sel = d.sel.filter((x) => selKey(x) !== selKey(e)); changed(); } }, '×'))));
      if (!d.sel.length) selBox.append(h('li', { class: 'c-dim lg-sel-none' }, '아직 고른 사람이 없습니다.'));

      const e = mem ? { id: mem.id, name: mem.name } : { id: null, name: v };

  function teamsValid(d) {

  // 다시 나누기: 여러 번 섞어 본 가운데 지금과 구성이 다르고 점수 차이가 작은 쪽(가장 작은 것 + 선수 평균의 5% 안)에서 고름
  const compKey = (teams) => teams.map((t) => t.slice().sort((x, y) => x - y).join(',')).sort().join('|');
  function splitSpread(sel, teams) {
    const sc = scoreMap(sel);
    const eq = teams.every((t) => t.length === teams[0].length);
    const v = teams.map((t) => { const s = t.reduce((a, i) => a + sc.of(i), 0); return eq ? s : t.length ? s / t.length : 0; });
    return Math.max(...v) - Math.min(...v);
  }
  function freshSplit(d) {
    const cur = d.teams ? compKey(d.teams.map((t) => t.members)) : '';
    const tries = [];
    for (let i = 0; i < 40; i++) { const t = autoSplit(d.sel, d.teamN, true); if (compKey(t) !== cur) tries.push({ t, s: splitSpread(d.sel, t) }); }
    if (!tries.length) return autoSplit(d.sel, d.teamN, true);
    const best = Math.min(...tries.map((x) => x.s));
    const tol = Math.max(20, scoreMap(d.sel).avg * 0.05);

  // ---------- 글로 복사 ----------
  function summary(lg) {
    const L = [];
    L.push(`[THUG 내전 리그] ${lg.name}${lg.example ? ' (예시)' : ''}`);
    L.push(`${fmtK(lg)} · ${lg.ents.length}명`);
    if (isBracket(lg)) { const dd = [drawDesc(lg), drawLogText(lg, bracket(lg))].filter(Boolean).join(' · '); if (dd) L.push(`대진: ${dd}`); }
    { const aw = awards(lg); if (aw) L.push(`메달(${fmt.day(aw.date)} 확정): ${medalText(lg, aw)}`); }
    const n = (i) => sideName(lg, i);
    const memoOf = (k) => (lg.rmemo[k] || '').trim();
    const pn = (e) => lg.ents[e].name;
    const setText = (s, k, note) => `  ${k + 1}세트 ${pn(s.w === 'a' ? s.a : s.b)} 승 vs ${pn(s.w === 'a' ? s.b : s.a)}${s.map ? ` (${s.map})` : ''}${note && note.streak >= 2 ? ` ${note.streak}연승` : ''}${note && note.ace ? ' 에이스 결정전' : ''}`;
    const matchText = (mt) => {
      if (mt.st === 'bye') return mt.winner >= 0 ? [`- ${n(mt.winner)} 부전승`] : [];
      if (mt.a == null || mt.b == null) return [`- ${mt.a != null ? n(mt.a) : '미정'} vs ${mt.b != null ? n(mt.b) : '미정'}`];
      if (!mt.res) return [`- ${n(mt.a)} vs ${n(mt.b)} (경기 전)`];
      const out = [`- ${n(mt.a)} ${mt.res.a} : ${mt.res.b} ${n(mt.b)}${mt.winner != null ? ` → ${n(mt.winner)} 승` : ' (진행 중)'}${mt.tm && mt.tm.ev.allkill != null ? ` · 올킬 ${pn(mt.tm.ev.allkill)}` : ''}`];
      if (mt.tm) mt.tm.sets.forEach((s, k) => out.push(setText(s, k, mt.tm.ev.notes[k])));
      return out;
    };
    if (isTeam(lg)) {
      L.push('');
      L.push('■ 팀');
      for (const t of lg.teams) L.push(`${t.name}${t.cap != null ? `(주장 ${pn(t.cap)})` : ''}: ${t.members.map(pn).join(', ')}`);
    }
    if (isBracket(lg)) {
      const rs = bracket(lg);
      const pod = podium(lg, rs);
      if (pod.first != null) L.push(`우승: ${n(pod.first)}${pod.second != null ? ` · 준우승: ${n(pod.second)}` : ''}${pod.third != null ? ` · 3위: ${n(pod.third)}` : ''}`);
      const block = (title, list, memo) => { L.push(''); L.push(`■ ${title}${memo ? ` (${memo})` : ''}`); if (list[0].undrawn) { L.push('- 추첨 전'); return; } for (const mt of list) L.push(...matchText(mt)); };
      rs.forEach((list, r) => { if (r === rs.length - 1 && rs.p3) block('3·4위전', [rs.p3], memoOf('p3')); block(list[0].round, list, memoOf(String(r))); });
    } else if (isTeam(lg)) {
      const { rows, ms } = teamStandings(lg);
      L.push('');
      L.push('■ 팀 순위');
      for (const r of rows) L.push(`${r.rank}. ${n(r.i)} ${r.w}승 ${r.l}패 (세트 ${r.sw}:${r.sl}, 승점 ${r.pt})`);
      L.push('');
      L.push('■ 경기');
      for (const mt of ms) L.push(...matchText(mt));
    } else {
      lg.groups.forEach((g, gi) => {
        const { rows, ms } = standings(lg, gi);
        L.push('');
        L.push(`■ ${lg.groups.length > 1 ? letter(gi) + '조 ' : ''}순위`);
        for (const r of rows) L.push(`${r.rank}. ${n(r.i)} ${r.w}승 ${r.l}패 (세트 ${r.d > 0 ? '+' : ''}${r.d}, 승점 ${r.pt})`);
        L.push('경기');
        for (const mt of ms) L.push(mt.res ? `- ${n(mt.a)} ${mt.res.a} : ${mt.res.b} ${n(mt.b)}${mt.winner == null ? ' (진행 중)' : ''}` : `- ${n(mt.a)} vs ${n(mt.b)} (경기 전)`);
      });
    }
    if (isTeam(lg)) {
      const top = playerStats(lg).filter((r) => r.n).slice(0, 5);
      L.push('');
      L.push('■ 개인 다승');
      if (!top.length) L.push('아직 세트가 없습니다.');
      for (const r of top) L.push(`${r.rank}. ${pn(r.i)} ${r.w}승 ${r.l}패 (${tname(lg, r.t)}${r.best >= 2 ? `, 최다 ${r.best}연승` : ''}${r.ak ? `, 올킬 ${r.ak}번` : ''})`);
    }
    if (lg.note && lg.note.trim()) { L.push(''); L.push('메모: ' + lg.note.trim()); }
    return L.join('\n');
  }

/* THUG 클랜 — 입장, 채널 줄, 메뉴, 화면 바꾸기 */
(() => {
  const iconCache = new Map();
  const app = {
    state: {},
    leave: [],
    mounted: [],
    onLeave(fn) { app.leave.push(fn); },
    onMount(fn) { app.mounted.push(fn); },
    me: () => store.get('thug.me', null),
    setMe: (id) => store.set('thug.me', id),
    // 모습 구하기(모든 초상이 이것을 씀): 저장값이 있으면 그 등급에 맞게 고치고, 없으면 그 등급의 기본 모습
    lookOf: (p) => app.fitLook(store.get('thug.look2.' + p.id, null), p),
    fitLook(look, p) {
      const g = p.grade || 1;
      const out = look && typeof look === 'object' ? PT.normalize(look, p, g) : PT.defaults(p, g);
      // 엔진이 아직 등급을 모를 때를 위한 덧막이: need가 등급보다 높은 값은 기본값(또는 열린 첫 값)으로
      const d = PT.defaults(p, g);
      for (const grp of PT.groups(p.main)) {
        const needOf = (id) => { const it = grp.items.find((o) => o.id === id); return it ? (it.need || 1) : 99; };
        if (needOf(out[grp.key]) <= g) continue;
        const open = grp.items.find((o) => (o.need || 1) <= g);
        out[grp.key] = needOf(d[grp.key]) <= g ? d[grp.key] : open ? open.id : out[grp.key];
      }
      if (look && look.medal) out.medal = look.medal; // 단 메달(리그 id). 엔진은 모름, 화면 겹으로 얹음
      return out;
    },
    // 메달: 리그 결과에서 계산(league.js의 LG.medals). 화면 하나를 그리는 동안은 한 번만 셈
    medalMap() {
      if (app._mm) return app._mm;
      let m = {};
      try { if (typeof LG !== 'undefined' && LG && LG.medals) { const r = LG.medals(); m = r instanceof Map ? Object.fromEntries(r) : (r || {}); } } catch (e) { console.error(e); }
      app._mm = m;
      return m;
    },
    medalsOf: (p) => app.medalMap()[p.id] || [],
    // 단 메달의 종류. 그 리그가 없어지거나 메달이 사라졌으면 null(자동으로 빠짐)
    medalKind(p, look) {
      const lid = (look || app.lookOf(p)).medal;
      if (!lid) return null;
      const m = app.medalsOf(p).find((x) => x.leagueId === lid);
      return m ? m.kind : null;
    },
    withMedal(el, p, where, look) {
      const k = app.medalKind(p, look);
      return k && typeof MD !== 'undefined' ? MD.wrap(el, k, where) : el;
    },
    linesOf: (p) => ({ say: '', win: '', lose: '', ...store.get('thug.line.' + p.id, {}) }),
    lineOf: (p) => app.linesOf(p).say || DB.autoLine(p),
    // 초상 아이콘(정지 그림). 같은 모습은 한 번 그린 것을 베껴 씀
    icon(p, size = 24) {
      const look = app.lookOf(p);
      const key = `${p.id}|${size}|${p.away ? 1 : 0}|${p.grade || 1}|${JSON.stringify(look)}`;
      let src = iconCache.get(key);
      if (!src) { src = PT.icon(look, size, { away: !!p.away, master: !!p.isMaster, grade: p.grade || 1 }); iconCache.set(key, src); }
      const c = document.createElement('canvas');
      c.width = src.width; c.height = src.height;
      c.className = 'pt-icon s' + size + (src.className && src.className !== 'pt-icon' ? ' ' + src.className : '');
      c.setAttribute('aria-hidden', 'true');
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(src, 0, 0);
      return app.withMedal(c, p, 'icon');
    },
    // 큰 초상. 화면을 떠날 때 타이머를 멈춤
    portrait(p, opts = {}, look) {
      const c = PT.portrait(look || app.lookOf(p), {
        scale: 3, animate: !UT.reduced, crown: p.ladderRank === 1, streak: p.streak || 0,
        away: !!p.away, master: !!p.isMaster, grade: p.grade || 1, label: `${p.name} 초상 · ${p.gradeName}`, ...opts,
      });
      app.onLeave(() => { if (c.destroy) c.destroy(); });
      return look ? c : app.withMedal(c, p, 'portrait');
    },
    clearIcons() { iconCache.clear(); },
    toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.hidden = false;
      clearTimeout(app._tt);
      app._tt = setTimeout(() => { t.hidden = true; }, 2600);
    },
  };

  const gate = document.getElementById('gate');
  const shell = document.getElementById('app');

  function enter() {
    gate.hidden = true;
    shell.hidden = false;
    boot();
  }

  function setupGate() {
    gate.hidden = false;
    const row = document.getElementById('gateEmb');
    const names = { terran: '테란', zerg: '저그', protoss: '프로토스', random: '랜덤', master: '클랜 마스터' };
    for (const k of Object.keys(names)) {
      row.append(h('figure', { class: 'emb-i' }, h('img', { src: `assets/emblem-${k}.webp`, alt: '', decoding: 'async' }), h('figcaption', null, names[k])));
    }
    const form = document.getElementById('gateForm');
    const pw = document.getElementById('pw');
    const err = document.getElementById('gateErr');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!pw.value.trim()) { err.hidden = false; pw.focus(); return; }
      store.set('thug.entered', true);
      enter();
    });
  }

  let first = true;
  const TABS = [['channel', '채널'], ['rank', '서열'], ['games', '전적'], ['league', '리그'], ['duel', '맞대결'], ['look', '꾸미기']];

  function boot() {
    const top = document.getElementById('top');
    top.append(h('div', { class: 'chan-in' },
      h('a', { class: 'chan-mark', href: '#channel', 'aria-label': 'THUG 클랜 채널로' }, h('img', { src: 'assets/logo-mark.webp', alt: '' })),
      h('div', { class: 'chan-id' },
        h('p', { class: 'chan-name' }, h('span', { class: 'chan-k' }, '채널:'), ' Clan THUG'),
        h('p', { class: 'chan-meta' },
          h('span', null, `클랜원 ${DB.persons.length}명`),
          h('span', null, `기록 ${fmt.when(DB.NOW)}`),
          staleTag())),
      h('button', { type: 'button', class: 'btn sm out', onclick: () => { if (LIVE) { LIVE.leave(); return; } store.del('thug.entered'); location.hash = ''; location.reload(); } }, IC.draw('exit', 1), h('span', null, '나가기'))));

    const nav = document.getElementById('nav');
    for (const [k, t] of TABS) {
      const a = h('a', { href: '#' + k, 'data-tab': k, class: 'nav-b' }, h('span', { class: 'nav-ic' }, IC.draw(k, 2, 'off'), IC.draw(k, 2, 'on')), h('span', { class: 'nav-t' }, t));
      nav.append(a);
    }

    const src = h('a', { href: DB.S.meta.sourceUrl, target: '_blank', rel: 'noopener' }, 'RepMastered');
    document.getElementById('foot').append(
      LIVE
        ? h('p', null, '기록: ', src, `에서 날마다 자동으로 받습니다. 마지막 갱신 ${fmt.when(DB.NOW)}. 클랜원 ${DB.persons.length}명, 화면에 실은 1:1 경기 ${DB.games.length}판(클랜원끼리 한 경기 전부와 최근 경기).`)
        : h('p', null, '기록: ', src, `에서 ${fmt.when(DB.NOW)}에 받은 표본입니다. Thug_로 시작하는 이름 80개, 1:1 경기 ${DB.games.length}판.`),
      LIVE
        ? h('p', null, LIVE.offline ? '지금은 연결이 안 되어 이 기기에 저장해 둔 기록을 보여 줍니다. ' : '', h('a', { href: '#admin' }, '입장 암호 바꾸기'), ' (클랜 마스터용)')
        : h('p', null, '임시 사이트입니다. 입장 암호 확인, 날마다 자동 갱신, 로그인과 저장은 정식판에서 붙습니다.'),
      h('p', null, '그림: THUG 대표 로고와 종족 엠블럼은 클랜 자료, 초상은 이 사이트에서 새로 그린 도트입니다.'),
      h('p', null, '글꼴: 갈무리 © quiple, SIL OFL 1.1'));

    window.addEventListener('hashchange', route);
    route();
  }

  function route() {
    for (const fn of app.leave.splice(0)) { try { fn(); } catch { /* 이미 멈춤 */ } }
    app._mm = null;
    app.mounted.length = 0;
    const hs = decodeURIComponent(location.hash.slice(1)) || 'channel';
    let view, tab;
    if (hs.startsWith('p--')) { view = V.profile(app, hs.slice(3)); tab = 'rank'; }
    else if (hs === 'duel' || hs.startsWith('duel--')) { const [, a, b] = hs.split('--'); view = V.duel(app, a, b); tab = 'duel'; }
    else if (hs === 'rank') { view = V.rank(app); tab = 'rank'; }
    else if (hs === 'games') { view = V.games(app); tab = 'games'; }
    else if (hs === 'look') { view = V.look(app); tab = 'look'; }
    else if (hs === 'admin' && LIVE) { view = adminView(); tab = ''; }
    else if (hs === 'league' || hs.startsWith('league--')) {
      // 내전 리그 화면은 league.js(전역 LG)가 만듦. 아직 없으면 준비 중 패널
      const lid = hs.startsWith('league--') ? hs.slice(8) : undefined;
      try { view = typeof LG !== 'undefined' && LG && LG.view ? LG.view(app, lid) : null; } catch (e) { console.error(e); view = null; }
      if (!view) view = V.leagueWait();
      tab = 'league';
    }
    else { view = V.channel(app); tab = 'channel'; }
    document.getElementById('view').replaceChildren(view);
    document.body.dataset.view = tab;
    for (const a of document.querySelectorAll('#nav a')) {
      if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    if (!first) window.scrollTo({ top: 0 });
    first = false;
    for (const fn of app.mounted.splice(0)) { try { fn(); } catch (e) { console.error(e); } }
  }

  // 갱신이 멈췄을 때만 보이는 표시(정식판). 임시 사이트는 '임시 사이트' 표시
  function staleTag() {
    if (!LIVE) return h('span', { class: 'temp-tag' }, '임시 사이트');
    const days = Math.floor((Date.now() - DB.NOW) / 864e5);
    return days >= 2 ? h('span', { class: 'temp-tag' }, `갱신 ${days}일 멈춤`) : null;
  }

  // 클랜 마스터: 운영 암호로 입장 암호 바꾸기
  function adminView() {
    const f = (id, label, ac) => [h('label', { class: 'lbl', for: id }, label), h('input', { id, class: 'field', type: 'password', autocomplete: ac })];
    const msg = h('p', { class: 'note', role: 'status' });
    const form = h('form', { class: 'gate-form adm-form', autocomplete: 'off' },
      f('admPw', '운영 암호', 'current-password'), f('newPw', '새 입장 암호(4자 이상)', 'new-password'), f('newPw2', '새 입장 암호 한 번 더', 'new-password'),
      h('div', { class: 'adm-row' }, h('button', { class: 'btn hot', type: 'submit' }, '입장 암호 바꾸기')), msg);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const a = form.querySelector('#admPw').value, n1 = form.querySelector('#newPw').value, n2 = form.querySelector('#newPw2').value;
      if (n1.trim().length < 4) { msg.textContent = '새 입장 암호를 4자 이상으로 넣어 주세요.'; return; }
      if (n1 !== n2) { msg.textContent = '새 입장 암호 두 칸이 다릅니다.'; return; }
      msg.textContent = '바꾸는 중입니다.';
      const r = await LIVE.call('thug_set_entry', { p_admin: a, p_new: n1 }).catch(() => null);
      if (r && r.ok) { msg.textContent = '바꿨습니다. 모든 기기에서 새 암호를 한 번 넣어야 합니다. 잠시 뒤 입장 화면으로 갑니다.'; setTimeout(() => LIVE.leave(), 2500); }
      else msg.textContent = !r ? '연결이 안 됩니다. 잠시 뒤 다시 해 주세요.' : r.reason === 'wrong' ? '운영 암호가 틀렸습니다.' : r.reason === 'wait' ? '여러 번 틀려 잠시 막혔습니다. 15분 뒤 다시 해 주세요.' : r.reason === 'notset' ? '운영 암호가 아직 정해지지 않았습니다.' : '바꾸지 못했습니다.';
    });
    return h('div', { class: 'page' }, h('header', { class: 'ptitle' }, h('h1', null, '입장 암호 바꾸기'), h('p', null, '클랜 마스터용. 바꾸면 모든 클랜원이 새 암호를 한 번 넣습니다')),
      h('section', { class: 'pnl adm' }, h('div', { class: 'pnl-b' }, form,
        h('p', { class: 'note' }, '새 암호는 카톡 오픈채팅방 공지에 올려 주세요. 운영 암호는 원장님께 받습니다.'))));
  }

  if (LIVE) { enter(); }
  else if (store.get('thug.entered', false)) enter(); else setupGate();
})();

};
</script>
<script>window.THUG_CFG={"url": "", "key": ""};
/* THUG 클랜 — 정식판(제 주소) 입장: 암호 → 통행증 → 창고에서 기록 받기 → 화면 시작.
   임시 사이트(Artifact)에는 묶지 않는다. build_site.py --live가 window.THUG_CFG(창고 주소·공개 열쇠)와 함께 넣는다. */
(() => {
  'use strict';
  const C = window.THUG_CFG || {};
  const PASS = 'thug.pass', CACHE = 'thug.bundle';
  const get = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  const del = (k) => { try { localStorage.removeItem(k); } catch { /* 저장 막힌 기기 */ } };

  async function call(fn, body, ms = 15000) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    try {
      const res = await fetch(`${C.url}/rest/v1/rpc/${fn}`, {
        method: 'POST', signal: ctl.signal,
        headers: { apikey: C.key, Authorization: `Bearer ${C.key}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(t); }
  }

  const live = window.THUG_LIVE = {
    offline: false,
    call,
    leave() { del(PASS); del(CACHE); location.hash = ''; location.reload(); },
  };

  const gate = document.getElementById('gate');
  const form = document.getElementById('gateForm');
  const pw = document.getElementById('pw');
  const err = document.getElementById('gateErr');
  const hint = document.getElementById('gateHint');
  const btn = form.querySelector('button[type=submit]');
  const HINT = '카톡 오픈채팅방 공지에 있는 클랜 입장 암호를 넣어 주세요. 한 번 넣으면 이 기기가 기억합니다.';

  function say(msg, bad) { err.textContent = msg; err.hidden = !msg; err.style.color = bad ? '' : 'var(--sub)'; }
  function busy(on, msg) { btn.disabled = on; pw.disabled = on; if (msg != null) say(msg, false); }

  function showGate(msg) {
    gate.hidden = false;
    hint.textContent = HINT;
    busy(false);
    say(msg || '', !!msg);
    const row = document.getElementById('gateEmb');
    if (!row.childElementCount) {
      const names = { terran: '테란', zerg: '저그', protoss: '프로토스', random: '랜덤', master: '클랜 마스터' };
      for (const k of Object.keys(names)) {
        const fig = document.createElement('figure'); fig.className = 'emb-i';
        const img = document.createElement('img'); img.src = `assets/emblem-${k}.webp`; img.alt = ''; img.decoding = 'async';
        const cap = document.createElement('figcaption'); cap.textContent = names[k];
        fig.append(img, cap); row.append(fig);
      }
    }
    setTimeout(() => pw.focus(), 50);
  }

  let started = false;
  function start(bundle, offline) {
    if (started) return;
    started = true;
    live.offline = !!offline;
    document.getElementById('snapshot').textContent = JSON.stringify(bundle);
    gate.hidden = true;
    window.__thugStart();
  }

  async function load(pass) {
    gate.hidden = false;
    hint.textContent = '';
    busy(true, '기록을 받는 중입니다.');
    let r = null;
    try { r = await call('thug_bundle', { p_token: pass.token }); } catch { r = null; }
    if (r && r.ok) {
      if (!put(CACHE, r.bundle)) del(CACHE);
      start(r.bundle, false);
    } else if (r && r.reason === 'pass') {
      del(PASS); del(CACHE);
      showGate('입장 암호가 바뀌었거나 기억 기간이 끝났습니다. 입장 암호를 다시 넣어 주세요.');
    } else if (r && r.reason === 'empty') {
      showGate('아직 기록이 올라오지 않았습니다. 수집기가 처음 돈 뒤에 다시 열어 주세요.');
    } else {
      const cached = get(CACHE);
      if (cached) start(cached, true);
      else showGate('연결이 안 됩니다. 인터넷 연결을 확인하고 다시 열어 주세요.');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = pw.value.trim();
    if (!C.url) { say('아직 준비 중입니다. 기록 창고를 이은 뒤에 열립니다.', true); return; }
    if (!v) { say('암호를 넣어 주세요.', true); pw.focus(); return; }
    busy(true, '확인하는 중입니다.');
    let r = null;
    try { r = await call('thug_enter', { p_pw: v }); } catch { r = null; }
    if (r && r.ok) {
      const pass = { token: r.token, exp: r.expires };
      put(PASS, pass);
      pw.value = '';
      load(pass);
      return;
    }
    busy(false);
    say(!r ? '연결이 안 됩니다. 잠시 뒤 다시 해 주세요.'
      : r.reason === 'wrong' ? '암호가 맞지 않습니다.'
      : r.reason === 'wait' ? '여러 번 틀려 잠시 막혔습니다. 15분 뒤 다시 해 주세요.'
      : r.reason === 'notset' ? '아직 입장 암호가 정해지지 않았습니다.' : '들어가지 못했습니다.', true);
    pw.select();
  });

  // 앱처럼 깔기: 화면 파일을 기기에 저장해 두는 도우미(기록은 저장하지 않음)
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 없어도 사이트는 돎 */ });
  }

  const pass = get(PASS);
  if (pass && pass.token && (!pass.exp || Date.parse(pass.exp) > Date.now())) load(pass);
  else { del(PASS); showGate(''); }
})();
</script></body></html>
