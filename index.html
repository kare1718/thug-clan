        if (i > 0 && G.mat[k - 1] && G.dep[k - 1] > bd) { best = k - 1; bd = G.dep[k - 1]; }
        if (i < size - 1 && G.mat[k + 1] && G.dep[k + 1] > bd) { best = k + 1; bd = G.dep[k + 1]; }
        if (j > 0 && G.mat[k - size] && G.dep[k - size] > bd) { best = k - size; bd = G.dep[k - size]; }
        if (j < size - 1 && G.mat[k + size] && G.dep[k + size] > bd) { best = k + size; bd = G.dep[k + size]; }
        if (best >= 0) fin[k] = isGlow(best) ? R[rid[best]][0] : R[rid[best]][0];
        continue;
      }
      if (isGlow(k)) continue;
      const dz = G.dep[k];
      let front = false;
      if (i > 0 && G.mat[k - 1] && G.dep[k - 1] > dz + 0.13) front = true;
      else if (i < size - 1 && G.mat[k + 1] && G.dep[k + 1] > dz + 0.13) front = true;
      else if (j > 0 && G.mat[k - size] && G.dep[k - size] > dz + 0.13) front = true;
      else if (j < size - 1 && G.mat[k + size] && G.dep[k + size] > dz + 0.13) front = true;
      if (front) { fin[k] = R[rid[k]][0]; continue; }
      // 등급 장식 조각 둘레: 바탕 쪽 한 칸을 그 바탕의 가장 어두운 색으로(장식이 붙은 금속으로 읽히게)
      if (size >= 32 && !(m & DEC)) {
        const nd = (q) => (G.mat[q] & DEC) && G.dep[q] > dz - 0.03;
        if ((i > 0 && nd(k - 1)) || (i < size - 1 && nd(k + 1)) || (j > 0 && nd(k - size)) || (j < size - 1 && nd(k + size))) { fin[k] = R[rid[k]][0]; continue; }
      }
      if (size >= 24) {
        let gk = -1;
        if (i > 0 && isGlow(k - 1)) gk = k - 1; else if (i < size - 1 && isGlow(k + 1)) gk = k + 1;
        else if (j > 0 && isGlow(k - size)) gk = k - size; else if (j < size - 1 && isGlow(k + size)) gk = k + size;
        if (gk >= 0) {
          const g = R[rid[gk]][1];
          if (P.lum[fin[k]] < P.lum[g]) fin[k] = g;
        }
      }
    }
    // 4b) 전설: 실루엣 둘레의 맥동하는 오라와 둘레를 도는 빛 입자(큰 초상만)
    if (st.deco >= 3 && size >= 56) {
      const GR = R[RAMP_ID.glow], gn = GR.length;
      const dist = new Uint8Array(N);
      for (let k = 0; k < N; k++) dist[k] = G.mat[k] ? 0 : 9;
      for (let p = 1; p <= 4; p++) {
        for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
          const k = j * size + i;
          if (dist[k] !== 9) continue;
          if ((i > 0 && dist[k - 1] === p - 1) || (i < size - 1 && dist[k + 1] === p - 1) || (j > 0 && dist[k - size] === p - 1) || (j < size - 1 && dist[k + size] === p - 1)) dist[k] = p;
        }
      }
      // 오라: 어두운 외곽선 바깥 한 칸은 고른 빛 테(맥동으로 밝기 변화),
      // 그 바깥 2~3칸은 실루엣 위쪽에서만 위로 솟는 불길 혀(옆·아래로는 번지지 않게)
      const pu = st.pulse, tk = st.tick || 0;
      for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
        const k = j * size + i, dd = dist[k];
        if (dd < 2 || dd > 4) continue;
        if (dd === 2) { fin[k] = GR[pu > 0.35 ? gn - 3 : gn - 4]; continue; }
        if (j >= size - 1 || dist[k + size] >= dd) continue; // 바로 아래가 실루엣 쪽일 때만
        const fl = vnoise(i * 0.55, j * 0.2 + tk * 0.42, 71);
        if (fl > (dd === 3 ? 0.5 : 0.64) - 0.1 * pu) fin[k] = GR[gn - 4];
      }
      // 빛 입자: 머리 둘레를 비스듬한 타원으로 돎(뒤쪽은 인물에 가림), 꼬리 2칸
      const cx = G.hi, cy = G.hj + size * 0.06, ra = size * 0.4, rb = size * 0.11, tl = size * 0.1;
      const GD = R[RAMP_ID.gold] || GR;
      for (let p = 0; p < 6; p++) {
        const a0 = p / 6 * 2 * PI + tk / TICKS * 2 * PI;
        for (let s = 2; s >= 0; s--) {
          const a = a0 - s * 0.1;
          const px = floor(cx + ra * cos(a)), py = floor(cy + rb * sin(a) - tl * cos(a));
          if (px < 0 || py < 0 || px >= size || py >= size) continue;
          const kk = py * size + px;
          if (sin(a) < 0 && G.mat[kk]) continue;
          const rp = p & 1 ? GD : GR;
          fin[kk] = rp[rp.length - 1 - s];
        }
      }
    }
    // 5) 불꽃(연승)
    if (st.fire >= 0) {
      const FR = R[RAMP_ID.fire];
      const t = st.fire;
      const base = size * 0.2;
      for (let i = 0; i < size; i++) {
        const hcol = base * (0.45 + 0.55 * vnoise(i * 0.35, t * 0.9, 61)) * (0.7 + 0.3 * sin(i * 0.7 + t));
        for (let j = size - 1; j >= 0; j--) {
          const hgt = size - 1 - j;
          if (hgt > hcol) break;
          const f = 1 - hgt / max(1, hcol);
          const thr = BAYER[(i & 3) + ((j & 3) << 2)];
          if (f < 0.25 && thr > f * 3) continue;
          fin[j * size + i] = FR[min(3, floor(f * 3.6))];
        }
      }
      const rnd = (a, b) => h2(a, b, 97);
      for (let p = 0; p < 9; p++) {
        const life = 16, ph = (t + p * 5) % life;
        const i = floor(rnd(p, floor((t + p * 5) / life)) * size);
        const j = floor(size - 1 - base * 0.6 - ph * size * 0.045);
        if (j >= 0 && i >= 0 && i < size) fin[j * size + i] = FR[ph < 5 ? 3 : ph < 10 ? 2 : 1];
      }
    }
    // 6) 지나가는 주사선 띠
    if (st.scan >= 0) {
      for (let j = st.scan; j < st.scan + 2 && j < size; j++) {
        if (j < 0) continue;
        for (let i = 0; i < size; i++) { const k = j * size + i; fin[k] = P.brighter[fin[k]]; }
      }
    }
    return fin;
  }

  /* ---------------- 그림 만들기 ---------------- */
  const FLAGS = (o) => (o.crown ? 1 : 0) | (o.master ? 2 : 0) | (decoOf(o.grade) << 2);
  const formIndex = (race, form) => max(0, FORMS[race].findIndex((f) => f.id === form));
  function lookOf(look) {
    const race = raceOf(look && look.race);
    return normalize(look, { main: race, name: 'x' });
  }
  const POSES = [];
  for (let f = 0; f < 8; f++) {
    const a = f / 8 * 2 * PI;
    POSES.push([0.075 * sin(a), 0.045 * sin(a * 2 + 0.6) * 0.6 + 0.03 * cos(a), 0.02 * sin(a + 1)]);
  }
  const REST = [0, 0, 0];

  function matSet(G) { const s = new Uint8Array(64); for (let k = 0; k < G.mat.length; k++) s[G.mat[k]] = 1; return s; }

  function renderIdx(look, size, pose, poseKey, opts, st) {
    const race = look.race, form = formIndex(race, look.form);
    const G = geom(race, form, FLAGS(opts), size, pose, poseKey);
    const G0 = geom(race, form, FLAGS(opts), size, REST, 'r');
    const tri = race === 'R' && look.glow === 'tri';
    const dc = decoOf(opts.grade);
    st.deco = dc;
    const P = palette(race, look, matSet(G0), glowHex(look), { fire: st.fire >= 0, tri, away: !!opts.away, gold: !!(opts.master || opts.crown) && race !== 'P', deco: dc });
    if (tri && st.tri === -1) st.tri = -2;
    return { idx: shade(G, P, race, form, look, st), P, mat: G.mat };
  }

  function toImage(idx, P, size, scale, flip, scan, mat) {
    const w = size * scale;
    const img = new ImageData(w, w);
    const d = img.data, rgb = P.rgb;
    for (let j = 0; j < size; j++) {
      for (let i = 0; i < size; i++) {
        const c0 = idx[j * size + (flip ? size - 1 - i : i)];
        const c = rgb[c0], cd = rgb[P.darker[c0]];
        for (let b = 0; b < scale; b++) {
          const useD = scan && b === scale - 1 && (j & 1) && !mat[j * size + (flip ? size - 1 - i : i)];
          const cc = useD ? cd : c;
          let o = ((j * scale + b) * w + i * scale) * 4;
          for (let a = 0; a < scale; a++) { d[o] = cc[0]; d[o + 1] = cc[1]; d[o + 2] = cc[2]; d[o + 3] = 255; o += 4; }
        }
      }
    }
    return img;
  }

  // 아이콘 등급 표시: 4 은 꺾쇠(아래 두 모서리), 5 금 꺾쇠(왼쪽 위 빼고 세 모서리), 6 금 꺾쇠 + 테두리 안쪽 빛
  // 왼쪽 위 모서리는 16px 클랜 마스터 점 자리라 비워 둠
  function gradeFrame(idx, P, size, dc) {
    const MR = P.R[dc === 1 ? RAMP_ID.silver : RAMP_ID.gold];
    if (!MR) return;
    const hi = MR[MR.length - 1], mid = MR[max(0, MR.length - 3)], lo = MR[1];
    const put = (i, j, c) => { idx[j * size + i] = c; };
    const s1 = size - 1;
    if (dc >= 3) {
      const GR = P.R[RAMP_ID.glow], gn = GR.length;
      for (let a = 0; a < size; a++) {
        const c = (a % 6 === 2) ? GR[gn - 1] : GR[gn - 3];
        put(a, 0, c); put(a, s1, c); put(0, a, c); put(s1, a, c);
        if (size >= 32 && (a & 1)) { put(a, 1, GR[gn - 4]); put(a, s1 - 1, GR[gn - 4]); put(1, a, GR[gn - 4]); put(s1 - 1, a, GR[gn - 4]); }
      }
    }
    const L = size >= 32 ? 7 : size >= 24 ? 6 : 4;
    const shade0 = P.R[RAMP_ID.bg][0];
    const corner = (ci, cj, sx, sy) => {
      const tk = size >= 24 ? 2 : 1;
      for (let a = 0; a < L; a++) for (let b = 0; b < tk; b++) {
        const c = a === 0 || (a === 1 && b === 0) ? hi : a < L - 1 ? (b ? mid : hi) : lo;
        put(ci + sx * a, cj + sy * b, c); put(ci + sx * b, cj + sy * a, c);
      }
      // 꺾쇠 안쪽 그림자 한 줄(배경과 갈라 보이게)
      for (let a = tk; a < L - 1; a++) { put(ci + sx * a, cj + sy * tk, shade0); put(ci + sx * tk, cj + sy * a, shade0); }
    };
    corner(0, s1, 1, -1); corner(s1, s1, -1, -1);
    if (dc >= 2) corner(s1, 0, -1, 1);
  }

  const ICACHE = new Map();
  function iconImage(look, size, opts) {
    const dc = decoOf(opts.grade);
    const key = [look.race, look.form, look.color, look.glow, look.mark, look.bg, size, opts.away ? 1 : 0, opts.master ? 1 : 0, dc].join('|');
    const hit = ICACHE.get(key);
    if (hit) return hit;
    const r = renderIdx(look, size, REST, 'r', { master: opts.master && size >= 24, away: opts.away, grade: opts.grade }, { pulse: 0, blink: false, tri: -1, scan: -1, fire: -1 });
    if (dc) gradeFrame(r.idx, r.P, size, dc);
    if (opts.master && size < 24) { // 16px: 금빛 모서리 점
      const g = r.P.R[RAMP_ID.gold] || r.P.R[RAMP_ID.glow];
      r.idx[0] = g[g.length - 1]; r.idx[1] = g[g.length - 2]; r.idx[size] = g[g.length - 2];
    }
    return cacheSet(ICACHE, key, toImage(r.idx, r.P, size, 1, false, false, r.mat), 400);
  }

  function icon(look, size, opts) {
    opts = opts || {};
    size = size <= 16 ? 16 : size <= 24 ? 24 : 32;
    const L = lookOf(look);
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    c.className = 'pt-icon';
    c.getContext('2d').putImageData(iconImage(L, size, opts), 0, 0);
    return c;
  }

  // 큰 초상: 24틱 한 바퀴(포즈 8 × 3, 깜빡임 1번), 프레임은 처음 쓸 때 한 번 만들어 둠
  const TICKS = 24;
  const SCACHE = new Map();
  function sequence(L, o) {
    const key = [L.race, L.form, L.color, L.glow, L.mark, L.bg, o.scale, o.flip ? 1 : 0, o.crown ? 1 : 0, o.master ? 1 : 0, o.away ? 1 : 0, o.fire ? 1 : 0, o.anim ? 1 : 0, decoOf(o.grade)].join('|');
    const hit = SCACHE.get(key);
    if (hit) return hit;
    const frames = new Array(o.anim ? TICKS : 1);
    const human = L.race === 'T' && L.form !== 'dome';
    const seq = {
      n: frames.length,
      frame(t) {
        if (frames[t]) return frames[t];
        const pi = o.anim ? t % 8 : 0;
        const st = {
          pulse: o.anim ? sin(t / 8 * 2 * PI) : 0.3,
          blink: o.anim && human && (t === 19),
          tri: L.race === 'R' && L.glow === 'tri' ? (o.anim ? floor(t / 8) % 3 : -2) : -1,
          scan: o.anim ? floor(t / TICKS * (H + 10)) - 5 : -1,
          fire: o.fire ? (o.anim ? t : 3) : -1,
          tick: o.anim ? t : 2,
        };
        const r = renderIdx(L, W, o.anim ? POSES[pi] : REST, o.anim ? 'p' + pi : 'r', o, st);
        frames[t] = toImage(r.idx, r.P, W, o.scale, o.flip, o.scale >= 3, r.mat);
        return frames[t];
      },
    };
    return cacheSet(SCACHE, key, seq, 40);
  }

  let FORCE_MOTION = false;
  const reducedMotion = () => { if (FORCE_MOTION) return false; try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } };
  const live = new Set();
  let timer = 0;
  const FRAME_MS = 143;
  function loop() {
    timer = 0;
    if (typeof document !== 'undefined' && document.hidden) return;
    const now = performance.now();
    for (const p of live) {
      if (!p.c.isConnected) {
        if (p.seen || now - p.born > 4000) live.delete(p);
        continue;
      }
      p.seen = true;
      p.t = (p.t + 1) % p.seq.n;
      p.ctx.putImageData(p.seq.frame(p.t), 0, 0);
    }
    if (live.size) timer = setTimeout(loop, FRAME_MS);
  }
  function kick() { if (!timer && live.size && !(typeof document !== 'undefined' && document.hidden)) timer = setTimeout(loop, FRAME_MS); }
  if (typeof document !== 'undefined') document.addEventListener('visibilitychange', kick);

  function portrait(look, opts) {
    opts = opts || {};
    const L = lookOf(look);
    const scale = max(1, min(12, Math.round(opts.scale || 3)));
    const anim = opts.animate !== false && !reducedMotion();
    const o = { scale, flip: !!opts.flip, crown: !!opts.crown, master: !!opts.master, away: !!opts.away, fire: (opts.streak || 0) >= 5, anim, grade: decoOf(opts.grade) ? gradeIn(opts.grade, 0) : 0 };
    const c = document.createElement('canvas');
    c.className = 'pt';
    c.width = W * scale; c.height = H * scale;
    c.setAttribute('role', 'img');
    if (opts.label) c.setAttribute('aria-label', opts.label);
    const ctx = c.getContext('2d');
    const seq = sequence(L, o);
    ctx.putImageData(seq.frame(0), 0, 0);
    let entry = null;
    if (anim && seq.n > 1) {
      entry = { c, ctx, seq, t: 0, born: performance.now(), seen: false };
      live.add(entry); kick();
    }
    c.destroy = () => { if (entry) live.delete(entry); entry = null; };
    return c;
  }

  // 시험 쪽에서 쓰는 내부 함수(화면 작업자는 쓰지 않음)
  const _test = {
    raw(look, size, opts) {
      const L = lookOf(look);
      opts = opts || {};
      const r = renderIdx(L, size, REST, 'r', opts, { pulse: 0.3, blink: !!opts.blink, tri: -1, scan: -1, fire: opts.fire ? 3 : -1, tick: 2 });
      return { idx: r.idx, rgb: r.P.rgb, n: r.P.n };
    },
    // 아이콘과 같은 경로(등급 꺾쇠 포함)로 색 번호만
    iconIdx(look, size, opts) {
      const L = lookOf(look); opts = opts || {};
      const r = renderIdx(L, size, REST, 'r', { master: opts.master && size >= 24, away: opts.away, grade: opts.grade }, { pulse: 0, blink: false, tri: -1, scan: -1, fire: -1 });
      if (decoOf(opts.grade)) gradeFrame(r.idx, r.P, size, decoOf(opts.grade));
      return { idx: r.idx, rgb: r.P.rgb };
    },
    clear() { GCACHE.clear(); PCACHE.clear(); ICACHE.clear(); SCACHE.clear(); },
    // 움직이는 초상 한 바퀴(24틱)를 모두 만들어 봄(틱 수를 돌려줌)
    cycle(look, opts) {
      const L = lookOf(look); opts = opts || {};
      const o = { scale: 3, flip: false, crown: !!opts.crown, master: !!opts.master, away: !!opts.away, fire: (opts.streak || 0) >= 5, anim: true, grade: decoOf(opts.grade) ? gradeIn(opts.grade, 0) : 0 };
      SCACHE.clear();
      const seq = sequence(L, o);
      for (let t = 0; t < seq.n; t++) seq.frame(t);
      return seq.n;
    },
    // 한 프레임 시간 나눠 재기: [기하, 팔레트, 음영] ms
    prof(look, opts) {
      const L = lookOf(look); opts = opts || {};
      const f = formIndex(L.race, L.form), fl = FLAGS(opts);
      GCACHE.clear(); PCACHE.clear();
      let t = performance.now();
      const G = geom(L.race, f, fl, W, REST, 'r');
      const a = performance.now() - t; t = performance.now();
      const dc = decoOf(opts.grade);
      const P = palette(L.race, L, matSet(G), glowHex(L), { fire: false, tri: false, away: false, gold: false, deco: dc });
      const b = performance.now() - t; t = performance.now();
      shade(G, P, L.race, f, L, { pulse: 0.3, blink: false, tri: -1, scan: -1, fire: -1, tick: 2, deco: dc });
      return [a, b, performance.now() - t];
    },
    // 재질별 칸 수(장식이 실제로 보이는지 셀 때)
    matCount(look, size, opts) {
      const L = lookOf(look), G = geom(L.race, formIndex(L.race, L.form), FLAGS(opts || {}), size || W, REST, 'r');
      const c = {}; for (const m of G.mat) if (m) c[m & 15] = (c[m & 15] || 0) + 1;
      return c;
    },
    forceMotion(on) { FORCE_MOTION = !!on; },
    liveCount() { return live.size; },
    colors(look, opts) { const s = new Set(); const r = this.raw(look, W, opts); for (const v of r.idx) s.add(v); return s.size; },
  };

  return { SIZE, defaults, normalize, groups, icon, portrait, _test };
})();

/* THUG 클랜 — 메달 겹(초상 위에 얹는 금·은·동 메달)
   초상 엔진(PT)과 따로 논다. 초상 그림이 나중에 그림 파일로 바뀌어도 그대로 얹을 수 있게
   초상 canvas나 img를 span으로 감싸고 그 위에 메달 canvas 하나를 겹친다. 바깥 자원 없음.

   API
   - MD.icon(kind, px)       kind 'gold'|'silver'|'bronze', px 그릴 크기(8·12·16·24 등).
                             리본+원판+반짝임 도트 canvas(class 'md', px×px, 정수 배율)를 돌려줌. kind가 틀리면 null.
   - MD.wrap(el, kind, where) el(초상 canvas·img 등)을 span.md-wrap으로 감싸 메달을 얹어 돌려줌.
                             where 'icon'(아이콘 16·24·32의 오른쪽 아래 모서리) | 'portrait'(큰 초상의 가슴, 아래 가운데에서 조금 위).
                             where를 안 주면 el 너비 32 이하는 'icon', 넘으면 'portrait'.
                             kind가 없거나 틀리면 el을 그대로 돌려줌. el이 이미 쪽에 붙어 있으면 그 자리에서 바꿔 끼움.
                             감싼 span은 el과 같은 크기·같은 줄 배치(display block이면 block+max-content, 아니면 inline-block)이고
                             el의 그림 픽셀은 건드리지 않음.
   - MD.LABEL               { gold: '금메달', silver: '은메달', bronze: '동메달' }
   위치·크기는 medal.css(.md-wrap, .md-icon, .md-portrait)에 있음. */
const MD = (() => {
  'use strict';
  const LABEL = { gold: '금메달', silver: '은메달', bronze: '동메달' };
  // 금속 [어두움, 중간, 밝음, 가장 밝음], 반짝임, 리본 [어두움, 중간, 밝음]
  const COL = {
    gold: { m: ['#6b4510', '#b07818', '#e5b234', '#ffe07a'], g: '#fffbe6', r: ['#7a1418', '#c9262e', '#ff6a5e'] },
    silver: { m: ['#454e5c', '#8390a2', '#bfcad8', '#eef3fa'], g: '#ffffff', r: ['#16307a', '#2f6ad8', '#8ec0ff'] },
    bronze: { m: ['#55290f', '#94512a', '#c97d45', '#efb07a'], g: '#fff0dc', r: ['#0f4d24', '#239448', '#7fe09a'] },
  };
  const LINE = '#0d0b10'; // 둘레 외곽선
  const BAYER2 = [0.125, 0.625, 0.875, 0.375];

  /* 모양 만들기: d 원판 지름, rw·rh 리본 폭·높이. 칸 값: 0 빈칸, 'k' 외곽선, 'm0'~'m3' 금속, 'g' 반짝임, 'r0'~'r2' 리본
     빛은 왼쪽 위에서(초상 엔진과 같은 쪽) */
  const VARIANTS = [
    { d: 4, rw: 2, rh: 1 },  // 6×7  (아이콘 16)
    { d: 5, rw: 3, rh: 2 },  // 7×9  (아이콘 24, 작은 표시 8~9)
    { d: 7, rw: 3, rh: 3 },  // 9×12 (아이콘 32, 12)
    { d: 9, rw: 5, rh: 4 },  // 11×15 (큰 초상, 초상 픽셀 한 칸 = 메달 한 칸)
  ];
  const SHAPES = new Map();
  function shape(v) {
    const key = v.d + ',' + v.rw + ',' + v.rh;
    if (SHAPES.has(key)) return SHAPES.get(key);
    const iw = Math.max(v.d, v.rw), ih = v.rh + v.d;
    const w = iw + 2, h = ih + 2;
    const g = new Array(w * h).fill(0);
    const at = (x, y) => (y + 1) * w + (x + 1);
    // 리본(원판 윗부분 뒤로 한 칸 들어감)
    const rx0 = Math.floor((iw - v.rw) / 2);
    const rcol = v.rw === 2 ? [1, 0] : v.rw === 3 ? [1, 2, 0] : [1, 2, 1, 1, 0];
    for (let y = 0; y < v.rh + 1; y++) for (let c = 0; c < v.rw; c++) g[at(rx0 + c, y)] = 'r' + rcol[c];
    // 큰 것은 리본 위 걸쇠(금속 막대)와 리본 가운데 접힌 그림자
    if (v.d >= 7) {
      for (let c = -1; c <= v.rw; c++) { const x = rx0 + c; if (x >= 0 && x < iw) g[at(x, 0)] = c < v.rw / 2 - 0.5 ? 'm3' : c < v.rw - 1 ? 'm2' : 'm1'; }
      if (v.d >= 9) for (let c = 0; c < v.rw; c++) g[at(rx0 + c, v.rh - 1)] = 'r' + Math.max(0, rcol[c] - 1);
    }
    // 원판
    const r = v.d / 2, cx = (v.d - 1) / 2 + (iw - v.d) / 2, cy = v.rh + (v.d - 1) / 2;
    for (let y = v.rh; y < ih; y++) for (let x = 0; x < iw; x++) {
      const dx = x - cx, dy = y - cy, rr = dx * dx + dy * dy;
      if (rr > r * r) continue;
      const dist = Math.sqrt(rr), nx = dx / r, ny = dy / r;
      const lit = -(nx + ny) * 0.7071; // 왼쪽 위가 +
      let t;
      if (dist > r - 1) t = lit > 0.25 ? 3 : lit > -0.35 ? 2 : 0; // 테: 왼쪽 위 밝게, 오른쪽 아래 어둡게
      else if (v.d >= 7 && dist > r - 2) t = lit > 0.2 ? 1 : lit < -0.2 ? 3 : 2; // 안쪽 새김 테(빛 반대로)
      else {
        const f = 1.9 + 0.9 * lit; // 1..3 사이
        t = v.d >= 7 ? Math.floor(f) + (f - Math.floor(f) > BAYER2[(x & 1) + ((y & 1) << 1)] ? 1 : 0) : Math.round(f);
        t = Math.max(1, Math.min(3, t));
      }
      g[at(x, y)] = 'm' + t;
    }
    // 가운데 새김 별(큰 것만): 밝은 십자 + 오른쪽 아래 그림자
    if (v.d >= 9) {
      const ix = Math.round(cx), iy = Math.round(cy);
      for (const [a, b] of [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]]) g[at(ix + a, iy + b)] = 'm3';
      for (const [a, b] of [[1, 1], [2, 0], [0, 2]]) g[at(ix + a, iy + b)] = 'm1';
    }
    // 반짝임 1~2칸(왼쪽 위 안쪽)
    const gx = Math.round(cx - r * 0.42), gy = Math.round(cy - r * 0.42);
    g[at(gx, gy)] = 'g';
    if (v.d >= 9) { g[at(gx + 1, gy)] = 'g'; g[at(gx, gy + 1)] = 'm3'; }
    // 외곽선(상하좌우 이웃)
    const out = g.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const k = y * w + x;
      if (g[k]) continue;
      if ((x > 0 && g[k - 1]) || (x < w - 1 && g[k + 1]) || (y > 0 && g[k - w]) || (y < h - 1 && g[k + w])) out[k] = 'k';
    }
    const s = { w, h, cells: out, d: v.d };
    SHAPES.set(key, s);
    return s;
  }

  const hexRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  function colorOf(kind, c) {
    const P = COL[kind];
    if (c === 'k') return LINE;
    if (c === 'g') return P.g;
    return c[0] === 'm' ? P.m[+c[1]] : P.r[+c[1]];
  }
  // 모양 → canvas(가로·세로 box 칸, 모양은 아래 가운데, 칸 하나 = s 화면 픽셀)
  function paint(kind, sh, s, box) {
    const bw = box ? box : sh.w * s, bh = box ? box : sh.h * s;
    const c = document.createElement('canvas');
    c.width = bw; c.height = bh;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(bw, bh), d = img.data;
    const ox = Math.floor((bw - sh.w * s) / 2), oy = bh - sh.h * s - Math.floor((bh - sh.h * s) / 2);
    const cache = {};
    for (let y = 0; y < sh.h; y++) for (let x = 0; x < sh.w; x++) {
      const cell = sh.cells[y * sh.w + x];
      if (!cell) continue;
      const rgb = cache[cell] || (cache[cell] = hexRgb(colorOf(kind, cell)));
      for (let b = 0; b < s; b++) for (let a = 0; a < s; a++) {
        const px = ox + x * s + a, py = oy + y * s + b;
        if (px < 0 || py < 0 || px >= bw || py >= bh) continue;
        const o = (py * bw + px) * 4;
        d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    c.className = 'md';
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', LABEL[kind]);
    return c;
  }

  // px 칸 안에 가장 크게 들어가는 모양과 정수 배율(같으면 배율이 작은 쪽, 즉 더 촘촘한 모양)
  function fit(px) {
    let best = null;
    for (const v of VARIANTS) {
      const sh = shape(v), m = Math.max(sh.w, sh.h), s = Math.floor(px / m);
      if (s < 1) continue;
      const fill = s * m;
      if (!best || fill > best.fill || (fill === best.fill && s < best.s)) best = { sh, s, fill };
    }
    return best || { sh: shape(VARIANTS[0]), s: 1 };
  }

  function icon(kind, px) {
    if (!COL[kind]) return null;
    px = Math.max(6, Math.round(Number(px) || 16));
    const f = fit(px);
    return paint(kind, f.sh, f.s, px);
  }

  const ICON_V = (base) => (base <= 16 ? VARIANTS[0] : base <= 24 ? VARIANTS[1] : VARIANTS[2]);
  const PORTRAIT_V = VARIANTS[3];
  const PORTRAIT_W = 56; // PT 큰 초상의 칸 수(canvas 너비 = 56 × 배율)

  function baseOf(el) {
    const w = el.tagName === 'CANVAS' ? el.width : (+el.getAttribute('width') || el.naturalWidth || 0);
    return w || 0;
  }
  function wrap(el, kind, where) {
    if (!el || !COL[kind]) return el;
    const base = baseOf(el);
    if (where !== 'icon' && where !== 'portrait') where = base && base <= 32 ? 'icon' : 'portrait';
    const w = document.createElement('span');
    w.className = 'md-wrap md-' + where + ' md-' + kind;
    // 줄 배치: el이 block(사이트의 canvas.pt·pt-icon)이면 감싼 것도 block(+max-content), 아니면 inline-block
    let blk = false;
    try { blk = el.isConnected ? getComputedStyle(el).display === 'block' : el.matches('canvas.pt, canvas.pt-icon, canvas.ic, img.pt, img.pt-icon'); } catch (e) { blk = false; }
    if (blk) w.classList.add('md-blk');
    if (el.style && el.style.verticalAlign) w.style.verticalAlign = el.style.verticalAlign;
    if (el.parentNode) el.parentNode.replaceChild(w, el);
    w.append(el);
    let m;
    if (where === 'icon') {
      const b = base || 16, sh = shape(ICON_V(b));
      m = paint(kind, sh, 1);
      m.style.width = (sh.w / b * 100).toFixed(3) + '%';
    } else {
      const sh = shape(PORTRAIT_V);
      m = paint(kind, sh, 1);
      m.style.width = (sh.w / PORTRAIT_W * 100).toFixed(3) + '%';
    }
    w.title = LABEL[kind];
    w.append(m);
    return w;
  }

  return { icon, wrap, LABEL, _shape: (i) => shape(VARIANTS[i]) };
})();

/* THUG 클랜 — 기록 계산: 서열, 내전 점수(ELO), 천적·숙적, 칭호, 자동 대사 */
const DB = (() => {
  const S = JSON.parse(document.getElementById('snapshot').textContent);

  const CFG = {
    randomPct: 20, eloStart: 1000, kNew: 40, kStd: 24, kNewN: 10, ranked: 3, upset: 150,
    activeDays: 7, restDays: 14, relMin: 3, rivalMin: 5, minGames: 30, teasing: false,
    // 맞대결 종합 예상: 요소별 가중치(쓸 수 없는 요소는 빼고 나머지를 합 1로 다시 나눔)
    pred: { wL: 0.35, wE: 0.25, wH: 0.35, wF: 0.10, half: 30, cK: 3, formN: 10, formMin: 5, fLo: 0.1, fHi: 0.9 },
    boardElo: 5, boardRace: 5, // 기록별 랭킹: 내전 승률, 상대 종족별 승률의 최소 판 수
    oppMin: 3, // 상대 전적 요약(승률이 가장 높은·가장 고전한 상대)에 넣는 최소 판 수
    // 캐릭터 등급: 래더 최고 티어와 내전 점수 가운데 높은 쪽. 숫자는 여기서만 바꿈
    grade: {
      names: ['', '설거지', '맛집', '조커', '잭', '킹', '갓'], // 클랜에서 쓰는 등급 이름(2026-11-25 원장님)
      none: '미배정', // 래더 기록도 내전 기준 판 수도 없는 사람(초상은 1등급 모습)
      ladder: { S: 6, A: 5, B: 4, C: 3, D: 2, E: 1, F: 1 }, // 래더 최고 티어 → 등급(기록 없음 = 1)
      elo: [[1150, 5], [1100, 4], [1050, 3], [1000, 2]], // 내전 점수 이상 → 등급(3전 이상일 때만, 6은 래더 S만)
      eloMin: 3,
    },
  };
  const NOW = Date.parse(S.meta.fetchedAt);
  const DAY = 864e5;
  const RACE = {
    T: { key: 'terran', label: '테란', color: '#e67d31' },
    Z: { key: 'zerg', label: '저그', color: '#a463da' },
    P: { key: 'protoss', label: '프로토스', color: '#41a6ec' },
    R: { key: 'random', label: '랜덤', color: '#d3cab6' },
  };
  const TIER = { S: '#e0453a', A: '#f08a1c', B: '#9f55e8', C: '#3a78e0', D: '#0ea5c4', E: '#2f9e5a', F: '#7d8590' };

  const persons = S.persons.filter((p) => !p.hidden);
  const byId = new Map(persons.map((p) => [p.id, p]));
  const shortName = (n) => n.replace(/^thug_/i, '') || n;

  for (const p of persons) {
    const { P, T, Z } = p.race;
    const max = Math.max(P, T, Z);
    p.main = P >= CFG.randomPct && T >= CFG.randomPct && Z >= CFG.randomPct ? 'R' : max === T ? 'T' : max === Z ? 'Z' : 'P';
    p.isMaster = p.id === S.meta.master;
    p.emblem = p.isMaster ? 'master' : RACE[p.main].key;
    p.short = shortName(p.name);
    p.winRate = p.w + p.l ? p.w / (p.w + p.l) : 0;
    p.daysAgo = Math.max(0, Math.round((NOW - Date.parse(p.last + 'T12:00:00Z')) / DAY));
    p.away = p.daysAgo > CFG.restDays;

  }

  // 래더 서열
  const ladder = persons.filter((p) => p.mmr).sort((a, b) => b.mmr.cur.v - a.mmr.cur.v || b.mmr.max.v - a.mmr.max.v);
  ladder.forEach((p, i) => { p.ladderRank = i + 1; });

  // 경기
  const games = S.games.map((g, i) => {

    const internal = p.length === 2 && p[0].id && p[1].id && p[0].id !== p[1].id;
    const winner = p.findIndex((x) => x.w === 1);
    return { ...g, i, p, time: Date.parse(g.t), internal, winner, kind: g.lad ? 'ladder' : internal ? 'internal' : 'room' };
  });
  const byPerson = new Map();
  for (const g of games) for (const x of g.p) if (x.id) (byPerson.get(x.id) || byPerson.set(x.id, []).get(x.id)).push(g);

  // 내전 점수(ELO): 시간순으로 처음부터 다시 계산
  const elo = new Map();
  const fresh = () => ({ r: CFG.eloStart, n: 0, w: 0, l: 0 });
  for (const g of games.filter((x) => x.internal && x.winner >= 0).sort((a, b) => a.time - b.time)) {
    const [A, B] = g.p;
    const ea = elo.get(A.id) || fresh(), eb = elo.get(B.id) || fresh();
    const expA = 1 / (1 + 10 ** ((eb.r - ea.r) / 400));
    const sa = g.winner === 0 ? 1 : 0;
    const ka = ea.n < CFG.kNewN ? CFG.kNew : CFG.kStd, kb = eb.n < CFG.kNewN ? CFG.kNew : CFG.kStd;
    const da = Math.round(ka * (sa - expA)), db = Math.round(kb * ((1 - sa) - (1 - expA)));
    g.elo = { before: [ea.r, eb.r], delta: [da, db] };
    g.upset = g.elo.before[g.winner] + CFG.upset <= g.elo.before[1 - g.winner];
    ea.r += da; eb.r += db; ea.n++; eb.n++;
    if (sa) { ea.w++; eb.l++; } else { eb.w++; ea.l++; }
    elo.set(A.id, ea); elo.set(B.id, eb);
  }
  const eloRank = [...elo.entries()].map(([id, e]) => ({ id, ...e })).sort((a, b) => b.r - a.r);
  eloRank.filter((e) => e.n >= CFG.ranked).forEach((e, i) => { e.rank = i + 1; });

  // 맞대결
  const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
  const h2h = new Map();
  for (const g of games) {
    if (!g.internal || g.winner < 0) continue;
    const k = pairKey(g.p[0].id, g.p[1].id);
    const e = h2h.get(k) || { w: {}, games: [] };
    const wid = g.p[g.winner].id;
    e.w[wid] = (e.w[wid] || 0) + 1;
    e.games.push(g);
    h2h.set(k, e);
  }
  const vs = (a, b) => {
    const e = h2h.get(pairKey(a, b));
    return e ? { aw: e.w[a] || 0, bw: e.w[b] || 0, games: e.games } : { aw: 0, bw: 0, games: [] };
  };
  const relations = (id) => {
    const out = [];
    for (const [k, e] of h2h) {
      const [a, b] = k.split('|');
      if (a !== id && b !== id) continue;
      const other = a === id ? b : a;
      const w = e.w[id] || 0, l = e.w[other] || 0, n = w + l;

      const r = w / n;
      let type = null;
      if (r <= 0.25) type = 'nemesis';
      else if (r >= 0.75) type = 'prey';
      else if (n >= CFG.rivalMin && r >= 0.4 && r <= 0.6) type = 'rival';
      if (type && (type !== 'prey' || CFG.teasing)) out.push({ id: other, w, l, n, type });
    }

  };
  const topPair = () => {

    for (const [k, e] of h2h) if (!best || e.games.length > best.n) best = { k, n: e.games.length };
    return best ? best.k.split('|') : [ladder[0]?.id, ladder[1]?.id];
  };

  // 내전 연승(표본 안에서 가장 최근 경기부터)
  for (const p of persons) {
    const list = (byPerson.get(p.id) || []).filter((g) => g.internal && g.winner >= 0);
    let s = 0;
    for (const g of list) { if (g.p[g.winner].id === p.id) s++; else break; }
    p.streak = s;
    p.elo = elo.get(p.id) || null;
  }

  // 캐릭터 등급(차등 지급): 래더 최고 티어와 내전 점수 가운데 높은 쪽
  const GR = CFG.grade;
  const gradeName = (g) => GR.names[g] || GR.names[1];
  const tiersFor = (g) => Object.keys(GR.ladder).filter((t) => GR.ladder[t] === g);
  const eloFor = (g) => (GR.elo.find(([, v]) => v === g) || [null])[0];
  // 그 등급에 오르는 조건(등급표에 씀)
  const gradeRule = (g) => {
    if (g <= 1) return `처음 등급(래더 최고 ${tiersFor(1).join('·')})`;
    const parts = [];
    if (tiersFor(g).length) parts.push(`래더 최고 ${tiersFor(g).join('·')}`);
    if (eloFor(g) != null) parts.push(`내전 점수 ${eloFor(g)} 이상`);
    return parts.join(' 또는 ');
  };
  for (const p of persons) {
    const lg = p.mmr ? (GR.ladder[p.mmr.max.t] || 1) : 1;
    let eg = 1;
    if (p.elo && p.elo.n >= GR.eloMin) { const hit = GR.elo.find(([v]) => p.elo.r >= v); eg = hit ? hit[1] : 1; }
    p.gradeLadder = lg; p.gradeElo = eg;
    p.grade = Math.max(lg, eg);
    p.gradeBy = eg > lg ? 'elo' : 'ladder';
    p.gradeNone = !p.mmr && !(p.elo && p.elo.n >= GR.eloMin);
    p.gradeName = p.gradeNone ? GR.none : gradeName(p.grade);
    p.gradeWhy = p.gradeNone ? `래더 기록과 내전 ${GR.eloMin}전이 아직 없음` : p.gradeBy === 'elo' ? `내전 점수 ${p.elo.r}` : `래더 최고 ${p.mmr.max.t} ${p.mmr.max.v}`;
    const n = p.grade + 1;
    if (p.gradeNone) p.gradeNext = `래더 경기를 하거나 내전을 ${GR.eloMin}전 하면 등급이 정해집니다.` + (p.elo ? ` 지금 내전 ${p.elo.n}전.` : '');
    else if (n > 6) p.gradeNext = '가장 높은 등급입니다.';

      if (e != null) ways.push(`내전 점수 ${e} 이상(${GR.eloMin}전 이상)` + (p.elo && p.elo.n >= GR.eloMin ? `, 지금 ${p.elo.r}` : p.elo ? `, 지금 ${p.elo.n}전` : ''));
      p.gradeNext = `다음 ${gradeName(n)}: ${ways.join(' 또는 ')}`;

  }
  const gradeCount = [0, 0, 0, 0, 0, 0, 0];
  for (const p of persons) gradeCount[p.grade]++;

  // 상대 전적: 승패가 난 1:1 경기를 상대별로 묶음(클랜원은 id, 바깥 상대는 이름)
  const oppCache = new Map();
  const opponents = (id) => {
    if (oppCache.has(id)) return oppCache.get(id);
    const map = new Map();
    for (const g of byPerson.get(id) || []) {
      if (g.winner < 0 || g.p.length !== 2) continue;
      const i = g.p.findIndex((x) => x.id === id), o = g.p[1 - i];
      if (o.id === id) continue;
      const key = o.id ? 'p:' + o.id : 'n:' + o.n.toLowerCase();
      let e = map.get(key);
      if (!e) {
        e = { key, id: o.id, name: o.id ? byId.get(o.id).name : o.n, n: 0, w: 0, l: 0, last: 0, games: [], races: { T: 0, Z: 0, P: 0 } };
        map.set(key, e);
      }
      const won = g.winner === i;
      e.n++; if (won) e.w++; else e.l++;
      e.last = Math.max(e.last, g.time);
      e.games.push(g);
      if (e.races[o.r] != null) e.races[o.r]++;
    }
    const out = [...map.values()];
    for (const e of out) {
      e.rate = e.n ? e.w / e.n : 0;
      e.games.sort((a, b) => b.time - a.time);
      const rs = Object.entries(e.races).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      e.race = rs.length ? rs[0][0] : 'R';
    }
    out.sort((a, b) => b.n - a.n || b.last - a.last);
    oppCache.set(id, out);
    return out;
  };

  // 최근 기세: 표본에서 승패가 난 1:1 최근 n경기(새 것부터)
  const form = (id, n = CFG.pred.formN) => {
    const list = [];
    for (const g of byPerson.get(id) || []) {
      if (g.winner < 0 || g.p.length !== 2) continue;
      const i = g.p.findIndex((x) => x.id === id);
      if (g.p[1 - i].id === id) continue;
      list.push({ g, won: g.winner === i });
      if (list.length >= n) break;
    }
    const w = list.filter((x) => x.won).length;
    return { list, w, l: list.length - w, rate: list.length ? w / list.length : 0 };
  };

  // 맞대결 종합 예상(A가 이길 확률). 요소: 래더 점수, 내전 점수, 상대 전적(최근일수록 무겁게), 최근 기세
  const expect = (ra, rb) => 1 / (1 + 10 ** ((rb - ra) / 400));
  const predict = (a, b) => {
    const PR = CFG.pred, A = byId.get(a), B = byId.get(b);
    const parts = [];
    if (A.mmr && B.mmr) parts.push({ k: 'ladder', label: '래더 점수', p: expect(A.mmr.cur.v, B.mmr.cur.v), w: PR.wL, why: `${A.mmr.cur.v} : ${B.mmr.cur.v}` });
    if (A.elo && B.elo && A.elo.n >= CFG.ranked && B.elo.n >= CFG.ranked) parts.push({ k: 'elo', label: '내전 점수', p: expect(A.elo.r, B.elo.r), w: PR.wE, why: `${A.elo.r} : ${B.elo.r}` });
    const hv = vs(a, b);
    if (hv.games.length) {
      let sw = 0, swin = 0, rw = 0, rl = 0;
      for (const g of hv.games) {
        const days = Math.max(0, (NOW - g.time) / DAY);
        const wt = 0.5 ** (days / PR.half);
        const aw = g.p[g.winner].id === a;
        sw += wt; if (aw) swin += wt;
        if (days <= PR.half) { if (aw) rw++; else rl++; }
      }
      const c = sw / (sw + PR.cK);
      parts.push({ k: 'h2h', label: '상대 전적', p: (swin + 1) / (sw + 2), w: PR.wH * c, why: `${hv.aw}승 ${hv.bw}패, 최근 ${PR.half}일 ${rw}승 ${rl}패 · 믿음 ${Math.round(c * 100)}%` });
    }
    const fa = form(a), fb = form(b);
    if (fa.list.length >= PR.formMin && fb.list.length >= PR.formMin) {
      const pf = Math.min(PR.fHi, Math.max(PR.fLo, 0.5 + (fa.rate - fb.rate) / 2));
      parts.push({ k: 'form', label: '최근 기세', p: pf, w: PR.wF, why: `최근 ${fa.list.length}경기 ${fa.w}승 ${fa.l}패 : ${fb.list.length}경기 ${fb.w}승 ${fb.l}패` });
    }
    const tot = parts.reduce((s, x) => s + x.w, 0);
    if (!parts.length || tot <= 0) return { p: null, parts: [], fa, fb };
    for (const x of parts) x.share = x.w / tot;
    return { p: parts.reduce((s, x) => s + x.p * x.share, 0), parts, fa, fb };
  };

  // 표본에서 사람마다: 이변 승리 수, 상대 종족별 승패, 표본 안 최고 내전 연승
  for (const p of persons) {
    p.upsets = 0; p.vsR = { T: [0, 0], Z: [0, 0], P: [0, 0] }; p.bestStreak = 0;
    let run = 0;
    const list = byPerson.get(p.id) || [];
    for (let k = list.length - 1; k >= 0; k--) { // 오래된 것부터
      const g = list[k];
      if (g.winner < 0 || g.p.length !== 2) continue;
      const i = g.p.findIndex((x) => x.id === p.id), o = g.p[1 - i];
      if (o.id === p.id) continue;
      const won = g.winner === i;
      if (won && g.upset) p.upsets++;
      if (p.vsR[o.r]) p.vsR[o.r][won ? 0 : 1]++;
      if (g.internal) { run = won ? run + 1 : 0; p.bestStreak = Math.max(p.bestStreak, run); }
    }
  }

  // 기록별 랭킹 부문(서열 화면 '기록별'). 최소 조건은 칭호와 같은 CFG 숫자를 씀
  const pctS = (w, l) => `${w}승 ${l}패`;
  const vsBoard = (r) => ({
    k: 'vs' + r, group: '상대 종족별(표본)', label: `${RACE[r].label} 상대 승률`, sample: true,
    cond: `표본에서 ${RACE[r].label} 상대 ${CFG.boardRace}전 이상`,
    ok: (p) => p.vsR[r][0] + p.vsR[r][1] >= CFG.boardRace,
    val: (p) => p.vsR[r][0] / (p.vsR[r][0] + p.vsR[r][1]), tie: (p) => p.vsR[r][0] + p.vsR[r][1], show: (v) => fmt.pct(v), sub: (p) => pctS(...p.vsR[r]),
  });
  const BOARDS = [
    { k: 'ladCur', group: '래더', label: '래더 현재 점수', cond: '래더 기록이 있는 사람', ok: (p) => !!p.mmr, val: (p) => p.mmr.cur.v, show: (v) => String(v), tier: (p) => p.mmr.cur, sub: (p) => `최고 ${p.mmr.max.t} ${p.mmr.max.v}` },
    { k: 'ladMax', group: '래더', label: '래더 최고 점수', cond: '래더 기록이 있는 사람', ok: (p) => !!p.mmr, val: (p) => p.mmr.max.v, show: (v) => String(v), tier: (p) => p.mmr.max, sub: (p) => `지금 ${p.mmr.cur.t} ${p.mmr.cur.v}` },
    { k: 'rate', group: '전체 기록', label: '승률', cond: `RepMastered 전체 기록 ${CFG.minGames}판 이상(승패가 난 판)`, ok: (p) => p.w + p.l >= CFG.minGames, val: (p) => p.winRate, tie: (p) => p.w + p.l, show: (v) => fmt.pct(v), sub: (p) => pctS(fmt.num(p.w), fmt.num(p.l)) },
    { k: 'wins', group: '전체 기록', label: '다승', cond: 'RepMastered 전체 기록', ok: (p) => p.w > 0, val: (p) => p.w, show: (v) => `${fmt.num(v)}승`, sub: (p) => `${fmt.num(p.games)}판 · 승률 ${fmt.pct(p.winRate)}` },
    { k: 'games', group: '전체 기록', label: '판 수', cond: 'RepMastered 전체 기록', ok: (p) => p.games > 0, val: (p) => p.games, show: (v) => `${fmt.num(v)}판`, sub: (p) => `래더 ${100 - p.nl}% · 방 ${p.nl}%` },
    { k: 'apm', group: '전체 기록', label: 'APM', cond: `전체 기록 ${CFG.minGames}판 이상`, ok: (p) => p.games >= CFG.minGames, val: (p) => p.apm, show: (v) => String(v), sub: (p) => `${fmt.num(p.games)}판 평균` },
    { k: 'fast', group: '전체 기록', label: '평균 경기 시간 짧은 순', asc: true, cond: `전체 기록 ${CFG.minGames}판 이상`, ok: (p) => p.games >= CFG.minGames, val: (p) => p.len, show: (v) => fmt.len(v), sub: (p) => `${fmt.num(p.games)}판 평균` },
    { k: 'slow', group: '전체 기록', label: '평균 경기 시간 긴 순', cond: `전체 기록 ${CFG.minGames}판 이상`, ok: (p) => p.games >= CFG.minGames, val: (p) => p.len, show: (v) => fmt.len(v), sub: (p) => `${fmt.num(p.games)}판 평균` },
    { k: 'eloRate', group: '내전(표본)', label: '내전 승률', sample: true, cond: `표본 내전 ${CFG.boardElo}전 이상`, ok: (p) => !!p.elo && p.elo.n >= CFG.boardElo, val: (p) => p.elo.w / p.elo.n, tie: (p) => p.elo.n, show: (v) => fmt.pct(v), sub: (p) => `${pctS(p.elo.w, p.elo.l)} · 내전 점수 ${p.elo.r}` },
    { k: 'eloWins', group: '내전(표본)', label: '내전 다승', sample: true, cond: '표본 내전 1승 이상', ok: (p) => !!p.elo && p.elo.w > 0, val: (p) => p.elo.w, show: (v) => `${v}승`, sub: (p) => `내전 ${p.elo.n}판 · ${pctS(p.elo.w, p.elo.l)}` },
    { k: 'streak', group: '내전(표본)', label: '내전 연승', sample: true, cond: '표본에서 지금 내전 1연승 이상(가장 최근 경기부터)', ok: (p) => p.streak > 0, val: (p) => p.streak, show: (v) => `${v}연승`, sub: (p) => `표본 최고 ${p.bestStreak}연승` },
    { k: 'upsets', group: '내전(표본)', label: '이변 횟수', sample: true, cond: `표본 내전에서 내전 점수 ${CFG.upset}점 이상 높은 상대를 이긴 판, 1번 이상`, ok: (p) => p.upsets > 0, val: (p) => p.upsets, show: (v) => `${v}번`, sub: (p) => (p.elo ? `내전 ${p.elo.n}판` : '') },
    vsBoard('T'), vsBoard('Z'), vsBoard('P'),
  ];
  const board = (k) => {
    const b = BOARDS.find((x) => x.k === k) || BOARDS[0];
    const rows = persons.filter((p) => b.ok(p)).map((p) => ({ p, v: b.val(p) }));
    // 같은 값이면 판이 많은 쪽을 위에(순위 숫자는 같게 둠)
    rows.sort((x, y) => (b.asc ? x.v - y.v : y.v - x.v) || (b.tie ? b.tie(y.p) - b.tie(x.p) : 0) || x.p.name.localeCompare(y.p.name, 'en', { sensitivity: 'base' }));
    rows.forEach((r, i) => { r.rank = i && rows[i - 1].v === r.v ? rows[i - 1].rank : i + 1; });
    return { b, rows, out: persons.length - rows.length };
  };

  // 칭호
  const titles = new Map();
  const give = (p, k, d) => { if (p) (titles.get(p.id) || titles.set(p.id, []).get(p.id)).push({ k, d }); };
  const best = (arr, f) => arr.slice().sort((a, b) => f(b) - f(a))[0];
  const enough = persons.filter((p) => p.games >= CFG.minGames);
  give(ladder[0], '본좌', '래더 점수 1위');
  const eloTop = eloRank.find((e) => e.n >= CFG.ranked);
  if (eloTop) give(byId.get(eloTop.id), '내전 최강', '내전 점수 1위(3전 이상)');
  give(best(persons.filter((p) => p.w + p.l >= CFG.minGames), (p) => p.winRate), '승률왕', '승률 1위(30판 이상)');
  give(best(persons, (p) => p.w), '다승왕', '이긴 판 수 1위');
  give(best(persons, (p) => p.games), '출석왕', '경기 수 1위');
  give(best(enough, (p) => p.apm), 'APM 1위', '평균 APM 1위(30판 이상)');
  give(best(enough, (p) => -p.len), '속전속결', '평균 경기 시간이 가장 짧음(30판 이상)');
  give(best(enough, (p) => p.len), '장기전 장인', '평균 경기 시간이 가장 김(30판 이상)');
  const streakTop = best(persons.filter((p) => p.streak >= 3), (p) => p.streak);
  if (streakTop) give(streakTop, '연승 중', `내전 ${streakTop.streak}연승 중`);
  for (const p of persons) p.titles = titles.get(p.id) || [];

  // 자동 대사
  const RACE_LINES = {
    T: ['벙커부터 짓고 보자', '마린 메딕 출동', '탱크 자리 잡았다'],
    Z: ['저글링 몰고 간다', '뮤탈 뜬다', '드론 하나만 더'],
    P: ['질럿 앞으로', '캐리어 띄운다', '프로브 정찰 간다'],
    R: ['오늘은 뭐가 나올까', '종족은 하늘이 정한다'],
  };
  const ANY = ['내전 ㄱㄱ', '투혼 한 판?', 'gg', '한 판만 더', '오늘 손 풀렸다', '빌드 연구 중', 'gl hf'];
  const autoLine = (p) => {
    const say = [];
    if (p.streak >= 3) say.push(`내전 ${p.streak}연승 중`);
    if (p.ladderRank === 1) say.push('본좌 등장');
    const last = (byPerson.get(p.id) || []).find((g) => g.internal && g.winner >= 0);
    if (last) {
      const won = last.p[last.winner].id === p.id;
      const opp = last.p.find((x) => x.id !== p.id);
      const rel = relations(p.id).find((r) => r.id === opp.id);
      if (!won && rel && rel.type === 'nemesis') say.push('다음엔 꼭 이긴다');
      else if (won && last.upset) say.push('이변은 계속된다');
    }
    if (p.away) say.push('자리 비움');
    if (!say.length) {
      const r = UT.rng(UT.hash(p.id + 'line'));
      const pool = [...RACE_LINES[p.main], ...ANY];
      say.push(pool[Math.floor(r() * pool.length)]);
    }
    return say[0];
  };

  // 최근 7일 내전
  const weekFrom = NOW - 7 * DAY;
  const week = games.filter((g) => g.internal && g.time >= weekFrom && g.winner >= 0);
  const wins = new Map();
  for (const g of week) { const id = g.p[g.winner].id; wins.set(id, (wins.get(id) || 0) + 1); }
  const weekTop = [...wins.entries()].sort((a, b) => b[1] - a[1])[0];
  const weekLong = week.slice().sort((a, b) => b.len - a.len)[0];
  const weekUpset = week.filter((g) => g.upset).sort((a, b) => (b.elo.before[1 - b.winner] - b.elo.before[b.winner]) - (a.elo.before[1 - a.winner] - a.elo.before[a.winner]))[0];

  return {
    S, CFG, NOW, DAY, RACE, TIER, persons, byId, ladder, games, byPerson, elo, eloRank, vs, relations, topPair, autoLine,
    opponents, gradeName, gradeRule, gradeCount, form, predict, BOARDS, board,
    week: { n: week.length, top: weekTop ? { p: byId.get(weekTop[0]), w: weekTop[1] } : null, long: weekLong, upset: weekUpset },
    internalCount: games.filter((g) => g.internal).length,
  };
})();

/* THUG 클랜 — 화면: 채널(홈), 서열, 전적, 프로필, 맞대결, 꾸미기 */
const V = (() => {
  const RC = (r) => (DB.RACE[r] || DB.RACE.R).color;
  const emb = (key, cls = 'emb', alt = '') => h('img', { class: cls, src: `assets/emblem-${key}.webp`, alt, decoding: 'async' });
  const raceBadge = (r) => { const k = DB.RACE[r] ? r : 'R'; return h('span', { class: 'rb', style: `--rc:${RC(k)}`, title: DB.RACE[k].label }, DB.RACE[r] ? r : '?'); };
  const tier = (m) => (m ? h('span', { class: 'tier', style: `--tc:${DB.TIER[m.t] || '#666'}`, title: `${m.t} 티어` }, m.t) : null);

  // ================= 채널(홈) =================
  function channel(app) {
    const st = app.state;
    st.lobby = st.lobby || 'news';

    // --- 클랜원 ---
    const people = DB.persons.slice().sort((a, b) => a.daysAgo - b.daysAgo || lastT(b) - lastT(a) || b.games - a.games);

    const ev = games.map((g) => ({ t: g.time, g }));
    const after = (g) => Math.min(DB.NOW, g.time + g.len * 1000 + 60000);
    const lastOf = (id, pred) => { for (let i = games.length - 1; i >= 0; i--) { const g = games[i]; if (g.p.some((x) => x.id === id) && (!pred || pred(g))) return g; } return null; };
    const said = new Set();
    // 표본 창 안에 그 사람 경기가 없으면 최근 결과 사이 아무 곳(이름으로 고정)에 끼움
    const near = (p) => games[games.length - 1 - (UT.hash(p.id) % Math.max(1, Math.min(15, games.length)))];
    const speak = (p, text, g) => {
      if (!p || said.has(p.id) || !text) return;
      said.add(p.id);
      const at = g || near(p);

    const meP = app.me() && DB.byId.get(app.me());

      h('li', { class: 'c c-ann' }, ts(DB.NOW), tag('note', '공지'), h('span', { class: 'c-body' }, (LIVE ? '' : '임시 사이트입니다. ') + '꾸민 모습과 대사는 이 기기에만 저장됩니다.')),
      master ? h('li', { class: 'c c-ann' }, ts(DB.NOW), tag('note', '공지'), h('span', { class: 'c-body' }, '클랜 마스터 ', plink(master), ' 님 · 내전 신청은 카톡 오픈채팅으로')) : null);
    log.replaceChildren(...lines);

        h('span', { class: 'rk' + (p.ladderRank <= 3 ? ' top' : '') }, p.ladderRank),
        app.icon(p, 24),
        h('span', { class: 'lad-n' }, h('span', { class: 'nm' }, p.name), p.ladderRank === 1 ? h('span', { class: 'ttl-s' }, '본좌') : null),

    // --- 휴대폰 전환 단추 ---

  }

  // ================= 서열 =================
  function rank(app) {

      }

        const ranked = DB.ladder.filter(ok);

        const row = (p) => h('a', { class: 'row' + (p.away ? ' away' : ''), href: '#p--' + p.id },

            h('span', { class: 'd-only sc' }, '최고'), h('span', { class: 'd-only' }, '승률'), h('span', { class: 'd-only sc' }, 'APM'), h('span', { class: 'd-only sc' }, '최근')),
          ...ranked.map(row),
          none.length ? h('div', { class: 'row-sep' }, `래더 기록 없음 ${none.length}명`) : null,
          ...none.map(row));
        note.textContent = '래더 점수는 사람마다 RepMastered에 적힌 최근 래더 점수입니다. 같은 배틀넷 계정의 Thug_ 아이디는 한 사람으로 묶었습니다.';

            h('span', { class: 'd-only sc' }, '판'), h('span', { class: 'd-only' }, '내전 승패'), h('span', { class: 'd-only' }, ''), h('span', { class: 'd-only' }, '')),
          ...rows.map((e) => {
            const p = DB.byId.get(e.id);
            return h('a', { class: 'row', href: '#p--' + p.id },
              h('span', { class: 'rk' + (e.rank && e.rank <= 3 ? ' top' : '') }, e.rank || '-'),
              app.icon(p, 24),
              nm(p, e.n >= DB.CFG.ranked ? `내전 ${e.n}판` : `내전 ${e.n}판 · 3전부터 정식 순위`),
              h('span', { class: 'sc' }, h('b', null, e.r)),
              h('span', { class: 'd-only sc' }, e.n),
              h('span', { class: 'd-only rate' }, wbar(e.w, e.l), h('small', null, `${e.w}승 ${e.l}패`)),
              h('span', { class: 'd-only' }, ''), h('span', { class: 'd-only' }, ''));
          }));
        note.textContent = LIVE ? `내전 점수는 지금까지 수집한 클랜원끼리 1:1 경기 ${DB.internalCount}판으로 계산했습니다. 1000점에서 시작해 이기면 오르고 지면 내려갑니다. 지난 기록이 채워지면 처음부터 다시 계산합니다.` : `내전 점수는 이번 표본 가운데 클랜원끼리 한 1:1 경기 ${DB.internalCount}판으로 계산했습니다. 1000점에서 시작해 이기면 오르고 지면 내려갑니다. 정식판에서는 모든 내전으로 다시 계산합니다.`;
      }
    };
    draw();
    return h('div', { class: 'page' }, pageTitle('서열', '래더 점수와 클랜원끼리 1:1 경기로 매긴 내전 점수'),
      pnl('전체 서열', { flush: true, right: tabs }, h('div', { class: 'toolbar' }, chips), bbar, h('div', { class: 'scroll-x' }, list), note));
  }

  // ================= 전적 =================
  function games(app) {
    const st = app.state;
    st.gKind = st.gKind || 'all';
    st.gq = st.gq || '';
    st.gShow = 40;
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': '경기 종류' });
    const q = h('input', { type: 'search', id: 'gq', class: 'field sm', placeholder: '이름 (두 이름이면 둘의 경기)', value: st.gq, 'aria-label': '이름으로 찾기, 두 이름을 띄어 쓰거나 쉼표로 나누면 둘이 붙은 경기만' });
    const qNote = h('p', { class: 'q-note', 'aria-live': 'polite' });
    const ul = h('ul', { class: 'glist' });
    const more = h('button', { type: 'button', class: 'btn wide' }, '더 보기');
    const cnt = h('span', { class: 'pnl-sub' });
    const kinds = [['all', '전체'], ['internal', '내전'], ['ladder', '래더'], ['room', '바깥 상대']];
    const draw = () => {
      chips.replaceChildren(...kinds.map(([k, t]) => chipBtn(st.gKind === k, t, () => { st.gKind = k; st.gShow = 40; draw(); })));
      // 한 이름: 그 이름이 낀 경기 / 두 이름: 한쪽은 첫 이름, 다른 쪽은 둘째 이름인 경기
      const terms = st.gq.toLowerCase().split(/[\s,]+/).filter(Boolean).slice(0, 2);
      const hit = (x, t) => x.n.toLowerCase().includes(t) || (x.id && DB.byId.get(x.id).aliases.some((a) => a.toLowerCase().includes(t)));
      const match = (g) => {
        if (!terms.length) return true;
        if (terms.length === 1) return g.p.some((x) => hit(x, terms[0]));
        const [A, B] = g.p;
        return !!B && ((hit(A, terms[0]) && hit(B, terms[1])) || (hit(A, terms[1]) && hit(B, terms[0])));
      };
      const rows = DB.games.filter((g) => (st.gKind === 'all' || g.kind === st.gKind) && match(g));
      if (terms.length === 2) {
        const w = [0, 0];
        for (const g of rows) if (g.winner >= 0) w[hit(g.p[g.winner], terms[0]) ? 0 : 1]++;
        qNote.textContent = `둘이 붙은 경기 ${rows.length}판 · ${terms[0]} ${w[0]}승 : ${terms[1]} ${w[1]}승`;
        qNote.hidden = false;
      } else qNote.hidden = true;
      ul.replaceChildren(...rows.slice(0, st.gShow).map((g) => gameRow(app, g)));
      if (!rows.length) ul.append(h('li', { class: 'empty' }, '맞는 경기가 없습니다.'));
      more.hidden = rows.length <= st.gShow;
      cnt.textContent = `${Math.min(rows.length, st.gShow)} / ${rows.length}판`;
    };
    q.addEventListener('input', () => { st.gq = q.value; st.gShow = 40; draw(); });
    more.addEventListener('click', () => { st.gShow += 40; draw(); });
    draw();
    return h('div', { class: 'page' }, pageTitle('전적', `받은 표본 ${DB.games.length}판 · 내전 ${DB.internalCount}판 (1:1만)`),
      pnl('경기 기록', { flush: true, right: cnt }, h('div', { class: 'toolbar' }, chips, q), qNote, ul, h('div', { class: 'pnl-foot' }, more),
        h('p', { class: 'note' }, '찾기 칸에 두 이름을 띄어 쓰거나 쉼표로 나눠 넣으면 둘이 붙은 경기만 나옵니다. 사람마다 최근 20판만 받은 표본입니다.')));
  }

  // 표본에서 상대 종족별·상대 티어별·맵별 승패
  function splits(p) {
    const vsRace = { T: [0, 0], Z: [0, 0], P: [0, 0] }, maps = new Map(), tiers = new Map();
    for (const g of DB.byPerson.get(p.id) || []) {
      if (g.winner < 0 || g.p.length !== 2) continue;
      const i = g.p.findIndex((x) => x.id === p.id), o = g.p[1 - i];
      if (o.id === p.id) continue;
      const won = g.winner === i;
      if (vsRace[o.r]) vsRace[o.r][won ? 0 : 1]++;
      const m = maps.get(g.map) || [0, 0];
      m[won ? 0 : 1]++;
      maps.set(g.map, m);
      if (o.id) { // 클랜원 상대만: 상대의 지금 래더 티어
        const op = DB.byId.get(o.id);
        const t = op.mmr ? op.mmr.cur.t : '-';
        const s = tiers.get(t) || [0, 0];
        s[won ? 0 : 1]++;
        tiers.set(t, s);
      }
    }
    const order = ['S', 'A', 'B', 'C', 'D', 'E', 'F', '-'];
    return {
      vsRace,
      tiers: order.filter((t) => tiers.has(t)).map((t) => [t, tiers.get(t)]),
      maps: [...maps.entries()].sort((a, b) => b[1][0] + b[1][1] - (a[1][0] + a[1][1])).slice(0, 6),
    };
  }

  const cell = (label, value, opt = {}) => h('div', { class: 'cell' + (opt.big ? ' big' : '') + (opt.wide ? ' wide' : '') + (opt.cls ? ' ' + opt.cls : '') },
    h('span', { class: 'cell-l' }, label), h('span', { class: 'cell-v' }, value), opt.sub ? h('span', { class: 'cell-s' }, opt.sub) : null);

  // 교신 창 모양의 초상 틀
  const comm = (canvas, p, cap) => h('figure', { class: 'comm', style: `--tc:${p.mmr ? DB.TIER[p.mmr.cur.t] : '#5f7394'}` },
    h('div', { class: 'comm-in' }, canvas), h('figcaption', { class: 'comm-cap' }, cap || [h('span', null, p.name), p.mmr ? tier(p.mmr.cur) : null]));

  // 등급 표시: 칸 6개 중 등급만큼 채움
  const pips = (g) => h('span', { class: 'pips g' + g, 'aria-hidden': 'true' }, [1, 2, 3, 4, 5, 6].map((k) => h('i', { class: k <= g ? 'on' : '' })));
  const gradeTag = (p) => h('span', { class: 'gtag g' + (p.gradeNone ? 0 : p.grade), title: p.gradeNone ? `캐릭터 등급 미배정 · ${p.gradeWhy}` : `캐릭터 등급 ${p.grade} · ${p.gradeWhy}` }, p.gradeName);
  const gradeCard = (p, link) => h('div', { class: 'gbox g' + (p.gradeNone ? 0 : p.grade) },
    h('p', { class: 'gb-k' }, '캐릭터 등급'),
    h('p', { class: 'gb-n' }, pips(p.gradeNone ? 0 : p.grade), h('b', null, p.gradeName), h('span', { class: 'gb-lv' }, p.gradeNone ? '초상은 1등급 모습' : `${p.grade}등급`)),
    h('p', { class: 'gb-why' }, h('span', { class: 'gb-l' }, '근거'), p.gradeWhy),
    h('p', { class: 'gb-next' }, p.gradeNext),
    link || null);

  // 반올림한 승률 막대 한 줄(상대 종족, 상대 티어, 맵)
  const spRow = (label, w, l) => h('div', { class: 'sp-i' + (w + l ? '' : ' none') },
    h('span', { class: 'sp-l' }, label), wbar(w, l),
    h('span', { class: 'sp-v' }, w + l ? [h('b', null, fmt.pct(w / (w + l))), ` ${w}승 ${l}패`] : '경기 없음'));

  // 상대 전적 패널
  function oppPanel(app, p) {
    const st = app.state;
    const all = DB.opponents(p.id);
    const MIN = DB.CFG.oppMin;
    const nClan = all.filter((e) => e.id).length, nOut = all.length - nClan;
    st.oppF = st.oppF || 'clan';
    st.oppS = st.oppS || 'n';
    // 클랜원 상대가 없으면 이 사람에게만 '전체'로 보여 줌(고른 값은 그대로 둠)
    let filter = st.oppF === 'clan' && !nClan ? 'all' : st.oppF;
    let shown = 10;
    const open = new Set();
    const rels = new Map(DB.relations(p.id).map((r) => [r.id, r]));
    const fChips = h('div', { class: 'chips tight', role: 'group', 'aria-label': '상대 거르기' });
    const sChips = h('div', { class: 'chips tight', role: 'group', 'aria-label': '정렬' });
    const sum = h('div', { class: 'opp-sum' });
    const list = h('ul', { class: 'opp' });
    const more = h('button', { type: 'button', class: 'btn sm wide' }, '더 보기');
    const foot = h('div', { class: 'pnl-foot' }, more);
    more.addEventListener('click', () => { shown = Infinity; draw(); });

    const who = (e) => (e.id ? DB.byId.get(e.id) : null);
    const sumCell = (label, e, sub, emptyV = '표본 부족', emptyS = `${MIN}전 이상 상대 없음`) => h('div', { class: 'os' }, h('span', { class: 'os-l' }, label),
      e ? [h('span', { class: 'os-v' }, who(e) ? app.icon(who(e), 16) : h('span', { class: 'pt-none' }), h('span', { class: 'nm' }, e.name)), h('span', { class: 'os-s' }, sub(e))]
        : [h('span', { class: 'os-v c-dim' }, emptyV), h('span', { class: 'os-s' }, emptyS)]);
    const line = (e) => `${e.n}판 · ${e.w}승 ${e.l}패 · ${fmt.pct(e.rate)}`;

    const detail = (e, did) => {
      const o = who(e);
      return h('div', { class: 'opp-d', id: did },
        h('ul', { class: 'og' }, e.games.map((g) => {
          const i = g.p.findIndex((x) => x.id === p.id), me = g.p[i], ot = g.p[1 - i], won = g.winner === i;
          return h('li', { class: 'og-i' },
            h('span', { class: 'res ' + (won ? 'w' : 'l') }, won ? '승' : '패'),
            h('time', { class: 'og-t', datetime: g.t }, fmt.when(g.time)),
            h('span', { class: 'og-r' }, raceBadge(me.r), h('span', { class: 'c-dim' }, 'vs'), raceBadge(ot.r)),
            h('span', { class: 'og-m' }, g.map),
            h('span', { class: 'og-len' }, fmt.len(g.len)),
            h('span', { class: 'kind k-' + g.kind }, KIND[g.kind]),
            g.room ? h('span', { class: 'og-room' }, '방 제목 ', h('q', null, g.room)) : null);
        })),
        h('div', { class: 'opp-links' }, o
          ? [h('a', { class: 'btn sm', href: `#duel--${p.id}--${o.id}` }, '맞대결 화면'), h('a', { class: 'btn sm', href: '#p--' + o.id }, `${o.short} 프로필`)]
          : h('span', { class: 'c-dim' }, '바깥 상대라 프로필과 맞대결 화면은 없습니다.')));
    };

    const row = (e, k) => {
      const o = who(e), rel = o && rels.get(o.id);
      const did = `opp-${k}`;
      const isOpen = open.has(e.key);
      const btn = h('button', { type: 'button', class: 'opp-r', 'aria-expanded': String(isOpen), 'aria-controls': did },
        o ? app.icon(o, 24) : h('span', { class: 'pt-none s24' }),
        h('span', { class: 'opp-n' }, raceBadge(o ? o.main : e.race), h('span', { class: 'nm' }, e.name),
          rel ? h('span', { class: 'reltag', 'data-t': rel.type }, REL[rel.type]) : null,
          o ? null : h('span', { class: 'out-tag' }, '바깥')),
        h('span', { class: 'opp-c' }, `${e.n}판`),
        h('span', { class: 'opp-wl' }, wl(e.w, e.l)),
        h('span', { class: 'opp-rate' }, wbar(e.w, e.l), h('small', null, fmt.pct(e.rate))),
        h('span', { class: 'opp-last' }, fmt.day(e.last)),
        h('span', { class: 'caret', 'aria-hidden': 'true' }));
      const li = h('li', { class: 'opp-li' + (isOpen ? ' open' : '') }, btn);
      let d = isOpen ? detail(e, did) : null;
      if (d) li.append(d);
      btn.addEventListener('click', () => {
        const now = !open.has(e.key);
        if (now) open.add(e.key); else open.delete(e.key);
        btn.setAttribute('aria-expanded', String(now));
        li.classList.toggle('open', now);
        if (now && !d) { d = detail(e, did); li.append(d); }
        if (d) d.hidden = !now;
      });
      return li;
    };

    const draw = () => {
      fChips.replaceChildren(...[['clan', '클랜원', nClan], ['out', '바깥 상대', nOut], ['all', '전체', all.length]].map(([k, t, n]) =>
        chipBtn(filter === k, [t, h('span', { class: 'chip-n' }, n)], () => { filter = k; st.oppF = k; shown = 10; draw(); })));
      sChips.replaceChildren(...[['n', '판 수'], ['rate', '승률']].map(([k, t]) => chipBtn(st.oppS === k, t, () => { st.oppS = k; draw(); })));
      const rows = all.filter((e) => filter === 'all' || (filter === 'clan' ? !!e.id : !e.id));
      // 승률순은 3전 이상을 먼저(1전 100%가 맨 위에 오지 않게)
      if (st.oppS === 'rate') rows.sort((a, b) => (b.n >= MIN) - (a.n >= MIN) || b.rate - a.rate || b.n - a.n);
      const ok = rows.filter((e) => e.n >= MIN);
      const most = rows.slice().sort((a, b) => b.n - a.n || b.last - a.last)[0];
      let best = ok.slice().sort((a, b) => b.rate - a.rate || b.n - a.n)[0];
      let worst = ok.slice().sort((a, b) => a.rate - b.rate || b.n - a.n)[0];
      if (ok.length === 1) { if (best.rate >= 0.5) worst = null; else best = null; }
      const noStruggle = !!worst && worst.rate >= 0.5; // 모두 이기고 있으면 '고전'이라 부르지 않음
      if (noStruggle) worst = null;
      sum.replaceChildren(
        sumCell('가장 많이 붙은 상대', most, line),
        sumCell(`승률이 가장 높은 상대 (${MIN}전 이상)`, best, line),
        noStruggle ? sumCell(`가장 고전한 상대 (${MIN}전 이상)`, null, line, '없음', `${MIN}전 이상 상대 모두 승률 50% 넘음`)
          : sumCell(`가장 고전한 상대 (${MIN}전 이상)`, worst, line));
      sum.hidden = !rows.length;
      list.replaceChildren(...rows.slice(0, shown).map((e) => row(e, `${p.id}-${all.indexOf(e)}`)));
      if (!rows.length) list.append(h('li', { class: 'empty' }, filter === 'clan' ? '표본에 클랜원과 붙은 경기가 없습니다.' : '표본에 맞는 상대가 없습니다.'));
      foot.hidden = rows.length <= shown;
      more.textContent = `더 보기 (${rows.length - Math.min(rows.length, shown)}명 더)`;
    };
    if (!all.length) {
      return pnl('상대 전적', { flush: true, cls: 'p-opp', right: h('span', { class: 'pnl-sub' }, '표본 기준') },
        h('p', { class: 'note' }, LIVE ? '아직 받은 1:1 경기가 없습니다. 수집기가 날마다 채웁니다.' : '이번 표본에는 이 사람의 1:1 경기가 없습니다. 표본은 12명의 최근 1:1 경기 20판씩이라 정식판에서 채워집니다.'));
    }
    draw();
    return pnl('상대 전적', { flush: true, cls: 'p-opp', right: h('span', { class: 'pnl-sub' }, '표본 기준') },
      h('div', { class: 'toolbar opp-tools' }, fChips, sChips),
      sum,
      h('div', { class: 'opp-head', 'aria-hidden': 'true' }, h('span', null, ''), h('span', null, '상대'), h('span', { class: 'opp-c' }, '판'), h('span', { class: 'opp-wl' }, '승패'), h('span', { class: 'opp-rate' }, '승률'), h('span', { class: 'opp-last' }, '마지막'), h('span', null, '')),
      list, foot,
      h('p', { class: 'note' }, `줄을 누르면 그 상대와 한 경기가 펼쳐집니다. 표본 기준: 12명의 최근 1:1 경기 20판씩. 천적은 3전 이상 승률 25% 이하, 숙적은 5전 이상 승률 40~60%.`));
  }

  // ================= 프로필 =================
  function profile(app, id) {

          h('h1', { class: 'prof-name' }, p.name),
          h('p', { class: 'prof-line' }, gradeTag(p), raceBadge(p.main), ` ${raceLabel}`, p.isMaster ? h('span', { class: 'mtag long' }, '클랜 마스터') : null,
            ' · ', p.mmr ? [tier(p.mmr.cur), ` ${p.mmr.cur.v}점`] : '래더 기록 없음', ` · ${p.away ? '자리 비움' : '마지막 경기 ' + fmt.days(p.daysAgo)}`),
          p.aliases.length > 1 ? h('p', { class: 'prof-alias' }, '같은 계정: ', p.aliases.filter((a) => a !== p.name).join(', ')) : null,
          h('p', { class: 'say' }, h('span', { class: 'say-k' }, '한마디'), h('span', { class: 'say-t' }, app.lineOf(p))),
          h('div', { class: 'btns' },
            foe ? h('a', { class: 'btn', href: `#duel--${p.id}--${foe}` }, '맞대결 보기') : null,
            h('a', { class: 'btn', href: '#look', onclick: () => app.setMe(p.id) }, '이 초상 꾸미기'),
            h('a', { class: 'btn', href: p.rmUrl, target: '_blank', rel: 'noopener' }, 'RepMastered'))),
        h('div', { class: 'prof-side' },
          emb(p.emblem, 'emb prof-emb', `${p.isMaster ? '클랜 마스터' : raceLabel} 엠블럼`),
          gradeCard(p))));

    const recTable = pnl('기록', { right: h('span', { class: 'pnl-sub' }, 'RepMastered 전체 기록') },
      h('div', { class: 'cells' },
        cell('승패', wl(p.w, p.l), { sub: wbar(p.w, p.l) }),
        cell('승률', fmt.pct(p.winRate), { big: true }),
        cell('판 수', fmt.num(p.games), { sub: `래더 ${100 - p.nl}% · 방 ${p.nl}%` }),
        cell('래더 현재', p.mmr ? [tier(p.mmr.cur), ` ${p.mmr.cur.v}`] : '-', { big: !!p.mmr }),
        cell('래더 최고', p.mmr ? [tier(p.mmr.max), ` ${p.mmr.max.v}`] : '-'),
        cell('래더 최저', p.mmr ? [tier(p.mmr.min), ` ${p.mmr.min.v}`] : '-'),
        cell('APM', p.apm, { big: true }),
        cell('평균 시간', fmt.len(p.len)),
        cell('내전 점수', p.elo ? `${p.elo.r}` : '-', { cls: 'fill2', sub: p.elo ? `${eloRow && eloRow.rank ? `내전 ${eloRow.rank}위 · ` : ''}표본 내전 ${p.elo.n}판 · ${p.elo.w}승 ${p.elo.l}패` : '표본에 내전 없음' }),
        cell('종족 비율', h('span', { class: 'races' }, ['T', 'Z', 'P'].map((r) => h('span', { class: 'race-seg', style: `--rc:${RC(r)};flex:${Math.max(p.race[r], 0.001)}`, title: `${DB.RACE[r].label} ${p.race[r]}%` }, p.race[r] >= 14 ? `${r} ${p.race[r]}%` : ''))), { wide: true })));

    const TLBL = (t) => (t === '-' ? h('span', { class: 'c-dim' }, '래더 기록 없음') : [tier({ t }), ' 티어']);
    const splitWin = pnl('상대에 따라 달라지는 것', { right: h('span', { class: 'pnl-sub' }, '표본 기준') },
      h('h3', { class: 'sp-h' }, '상대 종족별'),
      h('div', { class: 'sp' }, ['T', 'Z', 'P'].map((r) => spRow([raceBadge(r), ` ${DB.RACE[r].label}`], ...sp.vsRace[r]))),
      h('h3', { class: 'sp-h' }, '상대 티어별', h('small', null, '클랜원 상대만, 상대의 지금 래더 티어')),
      sp.tiers.length ? h('div', { class: 'sp' }, sp.tiers.map(([t, [w, l]]) => spRow(TLBL(t), w, l))) : h('p', { class: 'sp-none' }, '표본에 클랜원과 붙은 경기가 없습니다.'),
      h('h3', { class: 'sp-h' }, '맵별', h('small', null, '많이 한 맵 6개까지')),
      sp.maps.length ? h('div', { class: 'sp' }, sp.maps.map(([m, [w, l]]) => spRow(h('span', { class: 'nm', title: m }, m), w, l))) : h('p', { class: 'sp-none' }, '표본에 경기가 없습니다.'),
      h('p', { class: 'note' }, '판 수가 적으면 승률이 크게 흔들립니다. 승률 옆 승패 수를 함께 보세요.'));

    const recentWin = pnl('최근 경기', { flush: true, right: h('span', { class: 'pnl-sub' }, LIVE ? '받은 기록 기준' : '표본에 있는 것만') },
      myGames.length ? h('ul', { class: 'glist' }, myGames.map((g) => gameRow(app, g, p.id))) : h('p', { class: 'note' }, LIVE ? '아직 받은 1:1 경기가 없습니다. 수집기가 날마다 채웁니다.' : '이번 표본에는 이 사람의 1:1 경기가 없습니다. 정식판에서는 최근 10경기가 모두 뜹니다.'));

    const medals = app.medalsOf(p);
    const medalPanel = pnl('메달', { right: h('span', { class: 'pnl-sub' }, medals.length ? `${medals.length}개` : '리그 입상') },
      medals.length
        ? h('ul', { class: 'medals' }, medals.map((m) => h('li', null,
          typeof MD !== 'undefined' ? MD.icon(m.kind, 24) : null,
          h('b', null, (typeof MD !== 'undefined' ? MD.LABEL[m.kind] : m.kind)),
          h('a', { class: 'plink', href: '#league--' + m.leagueId }, m.leagueName),
          m.team ? h('span', { class: 'c-dim' }, m.team) : null,
          h('span', { class: 'c-dim' }, m.date ? fmt.date(new Date(+m.date + 9 * 3600e3).toISOString().slice(0, 10)) : ''))))
        : h('p', { class: 'note' }, '아직 메달이 없습니다.'),
      medals.length ? h('p', { class: 'note' }, '리그가 이 기기에만 저장되어 메달도 이 기기에서만 보입니다.') : null);

    return h('div', { class: 'page' }, head,
      medalPanel,
      oppPanel(app, p),
      h('div', { class: 'grid2' }, recTable, splitWin),
      recentWin);
  }

  // ================= 맞대결 =================
  function duel(app, a, b) {
    if (!DB.byId.has(a) || !DB.byId.has(b) || a === b) [a, b] = DB.topPair();
    const A = DB.byId.get(a), B = DB.byId.get(b);
    const sorted = DB.persons.slice().sort(byName);
    const pick = (id, cur, other, left) => h('select', {
      id, class: 'field pick', 'aria-label': left ? '왼쪽 선수' : '오른쪽 선수',
      onchange: (e) => { location.hash = left ? `duel--${e.target.value}--${other}` : `duel--${other}--${e.target.value}`; },
    }, sorted.map((p) => { const o = h('option', { value: p.id }, p.name); if (p.id === cur) o.selected = true; return o; }));
    let scale = 2;
    try { if (matchMedia('(min-width: 700px)').matches) scale = 3; } catch { /* 기본 2배 */ }

    const side = (p, flip) => h('div', { class: 'duel-side' },
      comm(app.portrait(p, { scale, flip }), p, [h('a', { class: 'plink', href: '#p--' + p.id }, p.name)]),
      h('p', { class: 'duel-meta' }, raceBadge(p.main), ' ', p.mmr ? [tier(p.mmr.cur), ` ${p.mmr.cur.v}`] : '래더 기록 없음'));

    const v = DB.vs(A.id, B.id);
    const pr = DB.predict(A.id, B.id);
    const bar = (pa, big) => h('div', { class: 'pred' + (big ? ' big' : '') },
      h('i', { style: `flex:${pa};--rc:${RC(A.main)}` }, fmt.pct(pa)),
      h('i', { style: `flex:${1 - pa};--rc:${RC(B.main)}` }, fmt.pct(1 - pa)));
    // 최근 5경기 승패 칸 + 최근 10경기 승률
    const formRow = (p, f) => h('div', { class: 'form-r' },
      h('span', { class: 'form-n' }, p.short),
      h('span', { class: 'dots', role: 'img', 'aria-label': `최근 ${Math.min(5, f.list.length)}경기 ` + f.list.slice(0, 5).map((x) => (x.won ? '승' : '패')).join(' ') },
        f.list.slice(0, 5).map((x) => h('i', { class: x.won ? 'w' : 'l' }, x.won ? '승' : '패')),
        f.list.length ? null : h('span', { class: 'c-dim' }, '표본에 경기 없음')),
      h('span', { class: 'form-v' }, f.list.length ? `최근 ${f.list.length}경기 ${fmt.pct(f.rate)}` : '-'));
    const predPanel = pnl('종합 예상', { right: h('span', { class: 'pnl-sub' }, '표본 기준') },
      pr.p == null ? h('p', { class: 'note' }, '둘 다 쓸 만한 기록이 없어 예상할 수 없습니다.') : [
        h('div', { class: 'pred-names' }, h('span', null, A.short), h('span', null, B.short)),
        bar(pr.p, true),
        h('ul', { class: 'why' }, pr.parts.map((x) => h('li', null,
          h('span', { class: 'why-l' }, x.label),
          h('span', { class: 'why-p' }, `${fmt.pct(x.p)} : ${fmt.pct(1 - x.p)}`),
          h('span', { class: 'why-s' }, `비중 ${Math.round(x.share * 100)}%`),
          h('span', { class: 'why-d' }, x.why)))),
      ],
      h('div', { class: 'forms' }, formRow(A, pr.fa), formRow(B, pr.fb)),
      h('p', { class: 'note' }, `래더 점수 ${DB.CFG.pred.wL * 100}%, 내전 점수 ${DB.CFG.pred.wE * 100}%, 상대 전적 최대 ${DB.CFG.pred.wH * 100}%(판이 적으면 줄어듦, 최근 ${DB.CFG.pred.half}일마다 무게 절반), 최근 기세 ${DB.CFG.pred.wF * 100}%를 섞습니다. 없는 요소는 빼고 나머지로 나눕니다. 승패 칸은 왼쪽이 가장 최근입니다.`));

    const cmpRow = (label, va, vb, fa = (x) => x, better = 'high') => {
      const max = Math.max(va, vb) || 1;
      const aWin = better === 'high' && va > vb, bWin = better === 'high' && vb > va;
      return h('div', { class: 'cmp' },
        h('span', { class: 'cmp-a' + (aWin ? ' best' : '') }, h('b', null, fa(va)), h('span', { class: 'cbar' }, h('i', { style: `width:${(va / max) * 100}%;--rc:${RC(A.main)}` }))),
        h('span', { class: 'cmp-l' }, label),
        h('span', { class: 'cmp-b' + (bWin ? ' best' : '') }, h('span', { class: 'cbar' }, h('i', { style: `width:${(vb / max) * 100}%;--rc:${RC(B.main)}` })), h('b', null, fa(vb))));
    };
    const mapRows = new Map();
    for (const g of v.games) { const m = mapRows.get(g.map) || { a: 0, b: 0 }; if (g.p[g.winner].id === A.id) m.a++; else m.b++; mapRows.set(g.map, m); }

    let shown = 5;
    const gl = h('ul', { class: 'glist' });
    const more = h('button', { type: 'button', class: 'btn sm wide' });
    const moreW = h('div', { class: 'pnl-foot' }, more);
    const drawG = () => {
      gl.replaceChildren(...v.games.slice(0, shown).map((g) => gameRow(app, g, A.id)));
      moreW.hidden = v.games.length <= shown;
      more.textContent = `더 보기 (${v.games.length - Math.min(shown, v.games.length)}판 더)`;
    };
    more.addEventListener('click', () => { shown = Infinity; drawG(); });
    drawG();

    return h('div', { class: 'page' }, pageTitle('맞대결', '두 사람을 고르면 상대 전적과 예상 승률이 나옵니다'),
      pnl('대진', null,
        h('div', { class: 'pickers' }, pick('duelA', A.id, B.id, true),
          h('button', { type: 'button', class: 'btn sm', onclick: () => { location.hash = `duel--${B.id}--${A.id}`; } }, '좌우 바꾸기'),
          pick('duelB', B.id, A.id, false)),
        h('div', { class: 'duel-top' }, side(A, false),
          h('div', { class: 'vs' }, h('span', { class: 'vs-x' }, 'VS'),
            h('p', { class: 'h2h' }, h('span', { class: v.aw > v.bw ? 'w' : '' }, v.aw), h('span', { class: 'c-dim' }, ':'), h('span', { class: v.bw > v.aw ? 'w' : '' }, v.bw)),
            h('span', { class: 'c-dim' }, '내전 상대 전적')),
          side(B, true))),
      predPanel,
      h('div', { class: 'grid2' },
        pnl('능력치 비교', null,
          h('div', { class: 'cmp-h' }, h('span', null, A.short), h('span', null, ''), h('span', null, B.short)),
          A.mmr && B.mmr ? cmpRow('래더 점수', A.mmr.cur.v, B.mmr.cur.v) : null,
          A.mmr && B.mmr ? cmpRow('최고 점수', A.mmr.max.v, B.mmr.max.v) : null,
          cmpRow('승률', A.winRate, B.winRate, fmt.pct),
          cmpRow('판 수', A.games, B.games, fmt.num),
          cmpRow('APM', A.apm, B.apm),
          cmpRow('평균 시간', A.len, B.len, fmt.len, 'none')),
        pnl('둘이 붙은 경기', { flush: true, right: h('span', { class: 'pnl-sub' }, `표본 기준 · ${v.games.length}판`) },
          v.games.length ? [
            gl, moreW,
            h('div', { class: 'scroll-x pad' }, h('table', { class: 'tbl' },
              h('thead', null, h('tr', null, h('th', null, '맵'), h('th', null, '판'), h('th', null, A.short), h('th', null, B.short), h('th', null, `${A.short} 승률`))),
              h('tbody', null, [...mapRows.entries()].sort((x, y) => (y[1].a + y[1].b) - (x[1].a + x[1].b)).map(([m, s]) => h('tr', null,
                h('td', null, m), h('td', null, `${s.a + s.b}`), h('td', null, `${s.a}승`), h('td', null, `${s.b}승`), h('td', null, fmt.pct(s.a / (s.a + s.b)))))))),
          ] : h('p', { class: 'note' }, '이번 표본에는 둘이 붙은 1:1 경기가 없습니다.'))));
  }

  // ================= 꾸미기 =================
  function look(app) {
    let id = app.me() || (DB.ladder[0] || DB.persons[0]).id;
    if (!DB.byId.has(id)) id = (DB.ladder[0] || DB.persons[0]).id;
    let p = DB.byId.get(id);
    let cur = app.lookOf(p);
    let live = null;
    const sel = h('select', { id: 'me', class: 'field pick', 'aria-label': '내 아이디' },
      DB.persons.slice().sort(byName).map((x) => { const o = h('option', { value: x.id }, x.name); if (x.id === id) o.selected = true; return o; }));
    const stage = h('div', { class: 'look-stage' });
    const raceNote = h('p', { class: 'note' });
    const opts = h('div', { class: 'opts' });
    const say = h('input', { id: 'say', class: 'field', maxlength: '30', placeholder: '' });
    const winL = h('input', { id: 'sayWin', class: 'field', maxlength: '30', placeholder: '예: 오늘 손 풀렸다' });
    const loseL = h('input', { id: 'sayLose', class: 'field', maxlength: '30', placeholder: '예: 한 판만 더' });
    const earned = h('ul', { class: 'earned' });
    const myGrade = h('div', { class: 'my-grade' });
    const medalOpts = h('div', { class: 'chips' });
    const gtbl = h('ol', { class: 'gtbl' });
    let scale = 5;
    try { if (!matchMedia('(min-width: 360px)').matches) scale = 4; } catch { /* 기본 5배 */ }

    const drawPreview = () => {
      if (live && live.destroy) live.destroy();
      live = PT.portrait(cur, { scale, animate: !UT.reduced, crown: p.ladderRank === 1, streak: p.streak || 0, master: !!p.isMaster, grade: p.grade, label: `미리 보기 · ${p.gradeName}` });
      stage.replaceChildren(
        h('div', { class: 'bubble' }, say.value.trim() || DB.autoLine(p)),
        comm(app.withMedal(live, p, 'portrait', cur), p));
      raceNote.textContent = `종족은 전적으로 자동으로 정해집니다. 지금 ${DB.RACE[p.main].label}.`;
    };
    const drawOpts = () => {
      // 등급이 모자란 선택지는 눌리지 않는 흐린 단추 + 필요한 등급
      opts.replaceChildren(...PT.groups(p.main).map((g) => h('fieldset', { class: 'opt' }, h('legend', null, g.label),
        h('div', { class: 'chips' }, g.items.map((o) => {
          const need = o.need || 1;
          const face = [o.swatch ? h('span', { class: 'sw', style: `background:${o.swatch}` }) : null, o.label];
          if (need > p.grade) {
            return h('button', { type: 'button', class: 'chip locked', disabled: true, title: `${DB.gradeName(need)} 등급부터` },
              ...face, h('small', { class: 'need' }, `${DB.gradeName(need)}부터`));
          }
          return chipBtn(cur[g.key] === o.id, face, () => { cur = app.fitLook({ ...cur, [g.key]: o.id }, p); drawOpts(); drawPreview(); });
        })))));
    };
    // 등급별 지급 표: 엔진의 need에서 읽어 만듦 + 엔진이 그리는 등급 장식은 문구로
    const drawGrade = () => {
      myGrade.replaceChildren(gradeCard(p));
      const grps = PT.groups(p.main);
      const hasHero = grps.some((g) => g.key === 'form' && g.items.some((o) => (o.need || 1) === 5));
      const EXTRA = { 4: ['등급 장식: 은빛 테두리'], 5: ['등급 장식: 금빛 테두리', ...(hasHero ? [] : ['킹 형태'])], 6: ['갓 오라'] };
      const rows = [];
      for (let g = 1; g <= 6; g++) {
        const gets = [];
        for (const grp of grps) {
          const at = grp.items.filter((o) => (o.need || 1) === g);
          if (!at.length) continue;
          gets.push(at.length === grp.items.length && at.length > 3 ? `${grp.label} ${at.length}가지 전부` : `${grp.label}: ${at.map((o) => o.label).join(', ')}`);
        }
        gets.push(...(EXTRA[g] || []));
        const open = g <= p.grade, now = !p.gradeNone && g === p.grade;
        rows.push(h('li', { class: 'gt-r' + (open ? ' open' : '') + (now ? ' now' : '') },
          h('span', { class: 'gt-b' }, pips(g)),
          h('span', { class: 'gt-n' }, h('b', null, DB.gradeName(g)), h('span', { class: 'gt-st' }, now ? '지금' : open ? '열림' : '잠김')),
          h('span', { class: 'gt-c' }, DB.gradeRule(g)),
          h('span', { class: 'gt-g' }, gets.length ? gets.join(' · ') : '새로 열리는 것 없음')));
      }
      gtbl.replaceChildren(...rows);
    };
    // 메달: 가진 메달 가운데 하나를 달거나 안 담
    const drawMedals = () => {
      const ms = app.medalsOf(p);
      const on = app.medalKind(p, cur) ? cur.medal : null;
      const pick = (lid) => { cur = { ...cur, medal: lid }; if (!lid) delete cur.medal; drawMedals(); drawPreview(); };
      medalOpts.replaceChildren(chipBtn(!on, '안 달기', () => pick(null)),
        ...ms.map((m) => chipBtn(on === m.leagueId, [typeof MD !== 'undefined' ? MD.icon(m.kind, 16) : null, ` ${typeof MD !== 'undefined' ? MD.LABEL[m.kind] : m.kind} · ${m.leagueName}`], () => pick(m.leagueId))));
      if (!ms.length) medalOpts.append(h('span', { class: 'c-dim' }, ' 리그에서 3위 안에 들면 메달이 생깁니다.'));
    };
    const drawEarned = () => {
      const items = [
        ['래더 1위 왕관', p.ladderRank === 1, p.ladderRank === 1 ? '지금 1위' : `지금 ${p.ladderRank ? p.ladderRank + '위' : '래더 기록 없음'}`],
        ['5연승 불꽃', p.streak >= 5, `내전 ${p.streak}연승`],
        ['티어 색 테두리', !!p.mmr, p.mmr ? `${p.mmr.cur.t} 티어` : '래더 기록 없음'],
        ['클랜 마스터 표시', !!p.isMaster, p.isMaster ? '클랜 마스터' : '클랜 마스터만'],
        ['부문 칭호', p.titles.length > 0, p.titles.length ? p.titles.map((t) => t.k).join(', ') : '부문 1위가 되면 붙음'],
        ['시즌 1위 표시', false, '래더 시즌이 끝나면 정해짐'],
        ['클랜전 승리 표시', false, '클랜전 세트 기록을 넣으면 붙음'],
      ];
      earned.replaceChildren(...items.map(([n, on, d]) => h('li', { class: on ? 'on' : '' }, h('span', { class: 'e-st' }, on ? '얻음' : '잠김'), h('span', { class: 'e-n' }, n), h('span', { class: 'e-d' }, d))));
    };
    const load = (nid) => {
      id = nid; p = DB.byId.get(id);
      cur = app.lookOf(p);
