<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>THUG 클랜 — 새 주소로 옮겼습니다</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05080f">
<style>
  @font-face { font-family: "Galmuri14"; src: url("fonts/Galmuri14.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Galmuri11"; src: url("fonts/Galmuri11.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Galmuri11"; font-weight: 700; src: url("fonts/Galmuri11-Bold.woff2") format("woff2"); font-display: swap; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #05080f; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    color: #e6eefc; font: 15px/26px "Galmuri14", "Galmuri11", ui-monospace, monospace;
    -webkit-font-smoothing: none; font-synthesis: none; word-break: keep-all; overflow-wrap: anywhere;
  }
  .card { width: min(440px, 100%); padding: 24px 22px 22px; text-align: center; background: #0a1530; box-shadow: inset 0 0 0 1px #2f63b8, 0 0 24px rgba(47, 99, 184, 0.25); }
  .logo { width: 96px; height: auto; }
  h1 { margin: 12px 0 0; font: 700 24px/34px "Galmuri11", "Galmuri14", ui-monospace, monospace; color: #fff; }
  .addr { margin: 14px 0 4px; padding: 10px 12px; font: 15px/26px "Galmuri14", ui-monospace, monospace; color: #f2d24b; background: #040a16; box-shadow: inset 0 0 0 1px #1a3462; overflow-wrap: anywhere; }
  p { margin: 12px 0 0; }
  .sub { font: 12px/22px "Galmuri11", "Galmuri14", ui-monospace, monospace; color: #b4c7e6; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; margin-top: 18px; padding: 0 22px; color: #fff; text-decoration: none;
         background: linear-gradient(180deg, #d9531f, #b23a12 55%, #7f2507); border: 1px solid #ffab85; }
  .btn:focus-visible { outline: 2px solid #e3f0ff; outline-offset: 2px; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/logo-mark.webp" alt="THUG">
  <h1>새 주소로 옮겼습니다</h1>
  <div class="addr">thugclan.github.io</div>
  <p id="msg">잠시 뒤 새 주소로 넘어갑니다. 이 기기에 저장된 입장 상태와 꾸미기도 함께 옮깁니다.</p>
  <a class="btn" id="go" href="https://thugclan.github.io/">새 주소로 가기</a>
  <p class="sub">홈 화면에 깐 THUG 아이콘은 지우고 새 주소에서 다시 깔아 주세요. 운영진은 새 주소에서 운영 암호를 한 번 다시 넣습니다.</p>
</main>
<script>
(() => {
  'use strict';
  const NEW = 'https://thugclan.github.io/';
  // 옮길 것: 입장 통행증·나·꾸미기·말풍선·옛 리그(운영진 통행증과 받은 기록은 빼고). 새 주소의 live.js가 같은 목록만 받음
  const keep = (k) => k === 'thug.pass' || k === 'thug.leagues' || k === 'thug.me' || /^thug\.(line|look2)\.[A-Za-z0-9_-]{1,64}$/.test(k);
  let to = (location.hash || '').replace(/^#/, '');
  if (!/^[A-Za-z0-9_.~-]{1,200}$/.test(to)) to = 'channel';
  let url = NEW + '#' + to;
  try {
    const d = {};
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && keep(k)) d[k] = localStorage.getItem(k); }
    if (Object.keys(d).length) {
      const bytes = new TextEncoder().encode(JSON.stringify({ v: 1, d }));
      let s = '';
      for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      const b64 = btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      url = NEW + '#move=' + b64 + '&to=' + encodeURIComponent(to);
    }
  } catch { /* 저장을 못 읽는 기기: 그냥 새 주소로 */ }
  document.getElementById('go').href = url;
  setTimeout(() => location.replace(url), 1500);
})();
</script>
</body>
</html>
